<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warnverlay Full Release</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Bebas Neue', sans-serif;
            background: #fff;
            color: #333;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 800;
            letter-spacing: 0.02em;
        }

        p {
            margin: 28px 0 36px;
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: 0.02em;
        }

        .resolution-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .resolution {
            display: block;
            width: 320px;
            max-width: 80vw;
            padding: 22px 24px;
            font-family: inherit;
            font-size: 1.6rem;
            font-weight: 800;
            color: #333;
            background: #fff;
            border: 2px solid #555;
            text-decoration: none;
            box-sizing: border-box;
        }

        .resolution:hover {
            background: #f5f5f5;
        }
    </style>
</head>
<body>
  <h1>Welcome to Warnverlay Access</h1>
  <p>select the Resolution below</p>
  <div class="resolution-container">
    <a href="720p.html" class="resolution">720p</a>
    <a href="1080p.html" class="resolution">1080p</a>
    <a href="1440p.html" class="resolution">1440p</a>
    <a href="2160p.html" class="resolution">2160p (4K)</a>

</html>
