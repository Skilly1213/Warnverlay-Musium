    function popupBounceOut(progress) {
      const n1 = 7.5625;
      const d1 = 2.75;
      if (progress < 1 / d1) return n1 * progress * progress;
      if (progress < 2 / d1) return n1 * (progress -= 1.5 / d1) * progress + 0.75;
      if (progress < 2.5 / d1) return n1 * (progress -= 2.25 / d1) * progress + 0.9375;
      return n1 * (progress -= 2.625 / d1) * progress + 0.984375;
    }

    function popupEase(name, progress) {
      if (name === "CubicEasingIn") return progress * progress * progress;
      if (name === "CubicEasingOut") return 1 - Math.pow(1 - progress, 3);
      if (name === "CubicEasingInOut") return progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;
      if (name === "BounceIn") return 1 - popupBounceOut(1 - progress);
      if (name === "BounceOut") return popupBounceOut(progress);
      return progress;
    }

    function computePopupTransitionMotion(board, progress, config, rect) {
      const type = config.type || "None";
      const dx = Number(config.dirX) || 0;
      const dy = Number(config.dirY) || 0;
      const dirX = dx === 0 && dy === 0 ? 0 : dx;
      const dirY = dx === 0 && dy === 0 ? -1 : dy;
      const distance = Math.max(rect.width, rect.height) * 0.55 * (type === "Scroll" ? 1.35 : 1);
      const visibleIn = progress;
      const visibleOut = 1 - progress;
      const motion = (opacity = 1, tx = 0, ty = 0, sx = 1, sy = 1, rotate = 0, origin = "", clipPath = "none") => ({
        opacity, transform: `translate(${tx}px, ${ty}px) scale(${sx}, ${sy}) rotate(${rotate}deg)`,
        transformOrigin: origin, clipPath, _motion: { tx, ty, sx, sy, rotate, origin }
      });

      if (Array.isArray(config._parallelStages)) {
        const elapsed = Math.max(0, Math.min(1, progress)) * config._parallelDurationMs;
        const motions = config._parallelStages.map(stage => {
          const delayMs = Math.max(0, Number(stage.delay) || 0) * 1000;
          const durationMs = Math.max(0, Number(stage.duration) || 0) * 1000;
          const stageProgress = elapsed < delayMs ? 0 : durationMs <= 0 ? 1 : Math.min(1, (elapsed - delayMs) / durationMs);
          const eased = popupEase(stage.easing, stageProgress);
          return computePopupTransitionMotion(board, stage.reverse ? 1 - eased : eased, {
            ...stage,
            _originX: config._originX,
            _originY: config._originY
          }, rect);
        });
        const combined = motions.reduce((result, item, index) => {
          const value = item._motion;
          if (index === 0) return { ...value, opacity: item.opacity };
          result.opacity *= item.opacity;
          result.tx += value.tx;
          result.ty += value.ty;
          result.sx *= value.sx;
          result.sy *= value.sy;
          result.rotate += value.rotate;
          if (value.origin) result.origin = value.origin;
          return result;
        }, { opacity: 1, tx: 0, ty: 0, sx: 1, sy: 1, rotate: 0, origin: "", clipPath: "none" });
        const clipPaths = motions.map(item => item.clipPath).filter(clipPath => clipPath && clipPath !== "none");
        let clipPath = clipPaths[clipPaths.length - 1] || "none";
        if (clipPaths.length > 1 && clipPaths.every(value => /^inset\(/i.test(value))) {
          const insets = clipPaths.map(value => {
            const values = value.match(/^inset\(([^)]+)\)$/i)[1].split(/\s+/).map(parseFloat);
            if (values.length === 1) return [values[0], values[0], values[0], values[0]];
            if (values.length === 2) return [values[0], values[1], values[0], values[1]];
            if (values.length === 3) return [values[0], values[1], values[2], values[1]];
            return values.slice(0, 4);
          });
          clipPath = `inset(${[0, 1, 2, 3].map(index => Math.max(...insets.map(inset => inset[index]))).join("% ")}%)`;
        }
        return motion(combined.opacity, combined.tx, combined.ty, combined.sx, combined.sy,
          combined.rotate, combined.origin, clipPath);
      }

      if (type === "None") return motion();
      if (type === "Hidden" || type === "Cut") return motion(board === "in" ? (progress >= 1 ? 1 : 0) : (progress >= 1 ? 0 : 1));
      if (type === "Fade") return motion(board === "in" ? visibleIn : visibleOut);
      if (type === "Fly" || type === "Scroll") {
        return board === "in" ? motion(visibleIn, -dirX * distance * (1 - progress), -dirY * distance * (1 - progress)) :
          motion(visibleOut, dirX * distance * progress, dirY * distance * progress);
      }
      if (type === "Zoom" || type === "ZoomFade" || type === "Expand") {
        let scale = board === "in" ? progress : 1 - progress;
        if (type === "Expand") scale *= scale;
        scale = Math.max(0.001, scale);
        return motion(type === "ZoomFade" ? (board === "in" ? visibleIn : visibleOut) : 1, 0, 0, scale, scale, 0, "center center");
      }
      if (type === "Rotate") {
        const sign = dirX < 0 ? -1 : dirX > 0 ? 1 : dirY >= 0 ? 1 : -1;
        return motion(board === "in" ? visibleIn : visibleOut, 0, 0, 1, 1,
          board === "in" ? (1 - progress) * 360 * sign : progress * 360 * sign, "center center");
      }
      if (type === "Reveal") {
        const visible = board === "in" ? progress : 1 - progress;
        const origin = `${dirX < 0 ? "left" : dirX > 0 ? "right" : "center"} ${dirY < 0 ? "top" : dirY > 0 ? "bottom" : "center"}`;
        const scale = Math.max(0.001, visible);
        return motion(1, 0, 0, dirX && dirY ? scale : dirX ? scale : 1, dirX && dirY ? scale : dirY ? scale : 1, 0, origin);
      }
      if (type === "Wipe") {
        const amount = (board === "in" ? 1 - progress : progress) * 100;
        let clipPath;
        if (Math.abs(dirX) >= Math.abs(dirY)) {
          clipPath = dirX < 0 ? `inset(0 ${amount}% 0 0)` : dirX > 0 ? `inset(0 0 0 ${amount}%)` :
            dirY < 0 ? `inset(${amount}% 0 0 0)` : `inset(0 0 ${amount}% 0)`;
        } else {
          clipPath = dirY < 0 ? `inset(${amount}% 0 0 0)` : `inset(0 0 ${amount}% 0)`;
        }
        return motion(1, 0, 0, 1, 1, 0, "", clipPath);
      }
      if (type === "MotionPath" && Array.isArray(config.motionPath) && config.motionPath.length > 1) {
        const points = config.motionPath;
        const lengths = [];
        let total = 0;
        for (let i = 1; i < points.length; i += 1) {
          const length = Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
          lengths.push(length);
          total += length;
        }
        let remaining = progress * total;
        let target = { ...points[points.length - 1], angle: 0 };
        for (let i = 0; i < lengths.length; i += 1) {
          const segmentLength = lengths[i];
          if (remaining <= segmentLength || i === lengths.length - 1) {
            const start = points[i];
            const end = points[i + 1];
            const amount = segmentLength ? remaining / segmentLength : 0;
            target = {
              x: start.x + (end.x - start.x) * amount,
              y: start.y + (end.y - start.y) * amount,
              angle: Math.atan2(end.y - start.y, end.x - start.x) * 180 / Math.PI
            };
            break;
          }
          remaining -= segmentLength;
        }
        const originX = Number(config._originX) || 0;
        const originY = Number(config._originY) || 0;
        const start = points[0];
        const tx = board === "in" ? ((target.x - originX) / 100) * rect.width : ((target.x - start.x) / 100) * rect.width;
        const ty = board === "in" ? ((target.y - originY) / 100) * rect.height : ((target.y - start.y) / 100) * rect.height;
        return motion(1, tx, ty, 1, 1, config.autoRotate ? target.angle : 0, "center center");
      }
      if (type === "Bounce") {
        const bounced = popupBounceOut(progress);
        return board === "in" ? motion(visibleIn, -dirX * distance * (1 - bounced), -dirY * distance * (1 - bounced), 0.25 + 0.75 * bounced, 0.25 + 0.75 * bounced, 0, "center center") :
          motion(visibleOut, dirX * distance * bounced, dirY * distance * bounced, Math.max(0.001, 1 - 0.75 * bounced), Math.max(0.001, 1 - 0.75 * bounced), 0, "center center");
      }
      if (type === "ImageSequence") {
        const opacity = progress <= 0.05 ? (board === "in" ? 0 : 1) : progress >= 0.95 ? (board === "in" ? 1 : 0) : 0.25 + 0.75 * (Math.floor(progress * 16) % 2);
        return motion(opacity);
      }
      return motion();
    }

    function compensatePopupTransitionDelay(config, compensationMs) {
      if (!config || !Number.isFinite(compensationMs) || compensationMs <= 0) return config;
      const delay = Math.max(0, Number(config.delay) || 0) * 1000;
      return {
        ...config,
        delay: Math.max(0, delay - compensationMs) / 1000,
        ...(config.secondAnimation ? {
          secondAnimation: compensatePopupTransitionDelay(config.secondAnimation, compensationMs)
        } : {})
      };
    }

    function getPopupTransitionDelays(config) {
      if (!config || !config.type || config.type === "None") return [];
      const delays = [Math.max(0, Number(config.delay) || 0) * 1000];
      if (config.secondAnimation) delays.push(...getPopupTransitionDelays(config.secondAnimation));
      return delays;
    }

    function playPopupBoxTransitionStage(element, config, board, rect, isFinalStage) {
      if (!element || !config || !config.type || config.type === "None" || typeof element.animate !== "function") return Promise.resolve();
      const duration = Math.max(0, Number(config.duration) || 0) * 1000;
      const delay = Math.max(0, Number(config.delay) || 0) * 1000;
      const origin = { ...config, _originX: Number(config._originX), _originY: Number(config._originY) };
      const hasWipe = config.type === "Wipe" || (config._parallelStages || []).some(stage => stage.type === "Wipe");
      const clipTarget = hasWipe ? element.querySelector(".popup-custom-surface") : null;
      const steps = duration > 0 ? 30 : 1;
      const frames = [];
      const clipFrames = [];
      for (let i = 0; i <= steps; i += 1) {
        const time = i / steps;
        const eased = popupEase(config.easing, time);
        const progress = config.reverse ? 1 - eased : eased;
        const motion = computePopupTransitionMotion(board, progress, origin, rect);
        if (clipTarget) {
          clipFrames.push({ clipPath: motion.clipPath, offset: time });
          delete motion.clipPath;
        }
        const frame = { ...motion, offset: time };
        delete frame._motion;
        frames.push(frame);
      }
      const animations = [element.animate(frames, { duration, delay, fill: "both", easing: "linear" })];
      if (clipTarget) animations.push(clipTarget.animate(clipFrames, { duration, delay, fill: "both", easing: "linear" }));
      return new Promise(resolve => setTimeout(resolve, delay + duration)).then(() => {
        const motionPathStages = config._parallelStages
          ? config._parallelStages.filter(stage => stage.type === "MotionPath")
          : config.type === "MotionPath" ? [config] : [];
        if (motionPathStages.length && rect.width && rect.height) {
          const offset = motionPathStages.reduce((total, stage) => {
            const stageConfig = {
              ...stage,
              _originX: config._originX,
              _originY: config._originY
            };
            const endProgress = stage.reverse ? 0 : 1;
            const stageMotion = computePopupTransitionMotion(board, endProgress, stageConfig, rect)._motion;
            total.tx += stageMotion.tx;
            total.ty += stageMotion.ty;
            return total;
          }, { tx: 0, ty: 0 });
          const style = window.getComputedStyle(element);
          const left = Number.parseFloat(style.left) || 0;
          const top = Number.parseFloat(style.top) || 0;
          element.style.left = `${((left + offset.tx) / rect.width) * 100}%`;
          element.style.top = `${((top + offset.ty) / rect.height) * 100}%`;
        }
        animations.forEach(animation => {
          try { animation.finish(); } catch (error) {}
        });
        const finalFrame = frames[frames.length - 1];
        element.style.opacity = String(finalFrame.opacity);
        element.style.transformOrigin = finalFrame.transformOrigin || "";
        if (config.type === "MotionPath") {
          const finalMotion = computePopupTransitionMotion(board, config.reverse ? 0 : 1, origin, rect)._motion;
          element.style.transform = `translate(0px, 0px) scale(${finalMotion.sx}, ${finalMotion.sy}) rotate(${finalMotion.rotate}deg)`;
        } else {
          element.style.transform = finalFrame.transform;
        }
        if (clipTarget && clipFrames.length) {
          clipTarget.style.clipPath = clipFrames[clipFrames.length - 1].clipPath;
        } else if (finalFrame.clipPath) {
          element.style.clipPath = finalFrame.clipPath;
        }
        animations.forEach(animation => {
          if (board !== "out" || !isFinalStage || config.type === "MotionPath") animation.cancel();
        });
      });
    }

    function getPopupMotionPathElementOrigin(element, boxes, rect) {
      const box = boxes[Number(element.dataset.boxIndex)];
      const centerOf = item => {
        const bounds = item.getBoundingClientRect();
        return {
          x: ((bounds.left + bounds.width / 2 - rect.left) / rect.width) * 100,
          y: ((bounds.top + bounds.height / 2 - rect.top) / rect.height) * 100
        };
      };
      if (!box || !box.groupId) return centerOf(element);
      const members = boxes.map((member, index) => ({
        member,
        element: document.querySelector(`.popup-custom-box[data-box-index="${index}"]`)
      })).filter(item => item.member && item.member.groupId === box.groupId && item.element);
      if (members.length < 2) return centerOf(element);
      const bounds = members.map(item => item.element.getBoundingClientRect());
      const left = Math.min(...bounds.map(item => item.left));
      const top = Math.min(...bounds.map(item => item.top));
      const right = Math.max(...bounds.map(item => item.right));
      const bottom = Math.max(...bounds.map(item => item.bottom));
      return {
        x: ((left + (right - left) / 2 - rect.left) / rect.width) * 100,
        y: ((top + (bottom - top) / 2 - rect.top) / rect.height) * 100
      };
    }

    function playPopupBoxTransition(element, config, board, rect, boxes, delayCompensationMs = 0) {
      const adjustedConfig = compensatePopupTransitionDelay(config, delayCompensationMs);
      if (!element || !adjustedConfig || !adjustedConfig.secondAnimation) return playPopupBoxTransitionStage(element, adjustedConfig, board, rect, true);
      const stages = [adjustedConfig, adjustedConfig.secondAnimation];
      const durationMs = Math.max(...stages.map(stage =>
        (Math.max(0, Number(stage.delay) || 0) + Math.max(0, Number(stage.duration) || 0)) * 1000
      ));
      const parallelConfig = {
        ...adjustedConfig,
        type: stages.some(stage => stage.type === "MotionPath") ? "MotionPath" : "Parallel",
        delay: 0,
        duration: durationMs / 1000,
        easing: "Linear",
        reverse: false,
        _parallelStages: stages,
        _parallelDurationMs: durationMs
      };
      return playPopupBoxTransitionStage(element, parallelConfig, board, rect, true);
    }

    function getPopupMotionPathOrigin(box, boxes) {
      const boxCenter = {
        x: Number(box.x) + Number(box.width) / 2,
        y: Number(box.y) + Number(box.height) / 2
      };
      if (!box.groupId) return boxCenter;

      const members = boxes.filter(member => member && member.groupId === box.groupId);
      if (members.length < 2) return boxCenter;

      let left = Infinity;
      let top = Infinity;
      let right = -Infinity;
      let bottom = -Infinity;
      for (const member of members) {
        left = Math.min(left, Number(member.x));
        top = Math.min(top, Number(member.y));
        right = Math.max(right, Number(member.x) + Number(member.width));
        bottom = Math.max(bottom, Number(member.y) + Number(member.height));
      }
      if (!(right > left) || !(bottom > top)) return boxCenter;
      return { x: left + (right - left) / 2, y: top + (bottom - top) / 2 };
    }

    async function playPopupCustomizationAnimations(config, areaMarqueePromise, sequenceStartTime) {
      const layer = document.getElementById("popupCustomLayer");
      if (!layer || !config) return;
      const rect = layer.getBoundingClientRect();
      const boxes = Array.isArray(config.boxes) ? config.boxes : [];
      const elements = Array.from(layer.querySelectorAll(".popup-custom-box"));
      const playPhase = (phase, delayCompensationMs = 0) => Promise.all(elements.map(element => {
        const index = Number(element.dataset.boxIndex);
        const box = boxes[index];
        if (!box) return Promise.resolve();
        let transition = phase === "in" ? box.transitionIn : box.transitionOut;
        if (transition && (transition.type === "MotionPath" || transition.secondAnimation && transition.secondAnimation.type === "MotionPath")) {
          const origin = getPopupMotionPathOrigin(box, boxes);
          transition = {
            ...transition,
            _originX: origin.x,
            _originY: origin.y
          };
        }
        return playPopupBoxTransition(element, transition, phase, rect, boxes, delayCompensationMs);
      }));
      await Promise.all([playPhase("in"), areaMarqueePromise || Promise.resolve()]);
      const elapsedMs = Number.isFinite(sequenceStartTime) ? Math.max(0, performance.now() - sequenceStartTime) : 0;
      const outDelays = boxes.flatMap(box => getPopupTransitionDelays(box && box.transitionOut));
      const earliestOutDelayMs = outDelays.length ? Math.min(...outDelays) : 0;
      // Shift the exit timeline uniformly so earlier waits don't collapse its stagger.
      const delayCompensationMs = Math.min(elapsedMs, earliestOutDelayMs);
      await playPhase("out", delayCompensationMs);
    }

    function finishPopupAlert(overlay, overlayImage) {
      overlay.style.display = "none";
      const layer = document.getElementById("popupCustomLayer");
      if (layer && typeof layer.getAnimations === "function") {
        layer.getAnimations({ subtree: true }).forEach(animation => animation.cancel());
      }
      overlayImage.style.opacity = "1";
      try { overlayImage.src = ""; } catch (error) {}
      setTimeout(() => {
        if (alertQueue.length) {
          triggerWarning(alertQueue.shift());
        } else {
          isOverlayActive = false;
        }
      }, 200);
    }

    function triggerWarning(opts) {
      const {
        audioSrc, eventText, areaDesc,
        type, pds, emergency, destructive,
        flashFloodConsiderable, flashFloodCatastrophic
      } = opts;

      const overlay            = document.getElementById("overlay");
      let overlayImage         = document.getElementById("overlayImage");
      const overlayAudio       = document.getElementById("overlayAudio");
      const testWarningContainer = document.getElementById("testWarningContainer");
      const testCountyContainer  = document.getElementById("testCountyContainer");

      testWarningContainer.removeAttribute("style");
      testCountyContainer.removeAttribute("style");
      testWarningContainer.className = "text-container";
      testCountyContainer.className  = "text-container";

      // apply styling per type
      if (type === "severe") {
        testWarningContainer.classList.add("severe");
        testCountyContainer.classList.add("severe");
        if (destructive) {
          testWarningContainer.classList.add("destructiveSevere");
          testCountyContainer.classList.add("destructiveSevere");
        } else if (opts.considerable) {
          testWarningContainer.classList.add("considerableSevere");
          testCountyContainer.classList.add("considerableSevere");
        }
      }
      else if (type === "tornado") {
        testWarningContainer.classList.add("tornado");
        testCountyContainer.classList.add("tornado");
        if (emergency) {
          testWarningContainer.classList.add("tornadoEmergency");
          testCountyContainer.classList.add("tornadoEmergency");
        } else if (pds) {
          testWarningContainer.classList.add("pdsTornado");
          testCountyContainer.classList.add("pdsTornado");
        }
      }
      else if (type === "flashFlood") {
        testWarningContainer.classList.add("flashFlood");
        testCountyContainer.classList.add("flashFlood");
        if (flashFloodCatastrophic) {
          testWarningContainer.classList.add("catastrophicFlashFlood");
          testCountyContainer.classList.add("catastrophicFlashFlood");
        } else if (flashFloodConsiderable) {
          testWarningContainer.classList.add("considerableFlashFlood");
          testCountyContainer.classList.add("considerableFlashFlood");
        }
      }
      // Special Weather Statement styling
      if (opts.type === "specialStatement") {
        testWarningContainer.classList.add("specialStatement");
        testCountyContainer.classList.add("specialStatement");
      }
      // Severe Thunderstorm Watch styling
      if (opts.type === "severeWatch") {
        testWarningContainer.classList.add("severeWatch");
        testCountyContainer.classList.add("severeWatch");
      }
      // Tornado Watch styling
      if (opts.type === "tornadoWatch") {
        testWarningContainer.classList.add("tornadoWatch");
        testCountyContainer.classList.add("tornadoWatch");
      }
      // Winter Storm Warning styling
      if (opts.type === "winterStorm") {
        testWarningContainer.classList.add("winterStorm");
        testCountyContainer.classList.add("winterStorm");
      }
      // Blizzard Warning styling
      if (opts.type === "blizzard") {
        testWarningContainer.classList.add("blizzard");
        testCountyContainer.classList.add("blizzard");
      }

      // Tropical Storm styling
      if (opts.type === "tropicalStorm") {
        testWarningContainer.classList.add("tropicalStorm");
        testCountyContainer.classList.add("tropicalStorm");
      }

      // Hurricane styling
      if (opts.type === "hurricane") {
        testWarningContainer.classList.add("hurricane");
        testCountyContainer.classList.add("hurricane");
      }

      // Snow Squall styling
      if (opts.type === "snowSquall") {
        testWarningContainer.classList.add("snowSquall");
        testCountyContainer.classList.add("snowSquall");
      }

      // Winter Storm Watch styling
      if (opts.type === "winterWatch") {
        testWarningContainer.classList.add("winterWatch");
        testCountyContainer.classList.add("winterWatch");
      }

      const popupCustomizationType = getPopupCustomizationType(opts);
      const popupCustomization = popupCustomizationType && window.POPUP_ALERT_CUSTOMIZATIONS ?
        window.POPUP_ALERT_CUSTOMIZATIONS[popupCustomizationType] : null;
      const isUpgradedText = /\bupgraded\b/i.test(eventText);
      const textVariant = isUpgradedText ? "upgraded" : "normal";
      const configuredAlertText = popupCustomization && popupCustomization.textOverrides &&
        popupCustomization.textOverrides[textVariant];
      const displayedEventText = typeof configuredAlertText === "string" && configuredAlertText.trim() ?
        configuredAlertText.trim() : eventText;
      renderPopupCustomization(popupCustomizationType, eventText, areaDesc, opts.concerning || "", {
        watchProbability: opts.watchProbability,
        mostProbablePeakTornadoIntensity: opts.mostProbablePeakTornadoIntensity,
        mostProbablePeakWindGust: opts.mostProbablePeakWindGust,
        alertFields: opts.alertFields || {}
      });

      const hasCssCustomization = !!(popupCustomization && (
        (Array.isArray(popupCustomization.boxes) && popupCustomization.boxes.length) ||
        (popupCustomization.media && popupCustomization.media.src)
      ));

      if (!hasCssCustomization) {
        finishPopupAlert(overlay, overlayImage);
        return;
      }

      overlayImage.style.display = "none";
      overlayImage.removeAttribute("src");

      const selectedAudioSrc = popupCustomization && popupCustomization.audio &&
        typeof popupCustomization.audio.src === "string" && popupCustomization.audio.src ?
        popupCustomization.audio.src : audioSrc;
      if (selectedAudioSrc) {
        overlayAudio.src = selectedAudioSrc;
        overlayAudio.play().catch(() => {});
      } else {
        overlayAudio.pause();
        overlayAudio.src = "";
      }

      testWarningContainer.textContent = displayedEventText;
      testCountyContainer.textContent = areaDesc;
      overlay.style.display = "flex";
      const animationSequenceStartTime = performance.now();
      const areaMarqueePromise = Promise.all([
        startAlertAreaMarquee(testCountyContainer),
        startPopupAreaMarquees(document.getElementById("popupCustomLayer"))
      ]);

      playPopupCustomizationAnimations(popupCustomization, areaMarqueePromise, animationSequenceStartTime)
        .catch(error => console.warn("Popup transition animation failed.", error))
        .finally(() => finishPopupAlert(overlay, overlayImage));
    }

    // Helper: Extract damage threats and detection from new warnverlay API's "alertinfo"
    function extractThreatsFromWarnverlay(alertInfo) {
      const ai = alertInfo || {};
      const tornadoDetection = ai.TORNADO || null;
      const tornadoDetectionRadarIndicated = tornadoDetection === "RADAR INDICATED";
      const tornadoDetectionObserved = tornadoDetection === "OBSERVED";
      const tornadoDamageThreatCatastrophic = ai.TORNADO_DAMAGE_THREAT === "CATASTROPHIC";
      const tornadoDamageThreatConsiderable = ai.TORNADO_DAMAGE_THREAT === "CONSIDERABLE";
      const thunderstormDamageThreatConsiderable = ai.THUNDERSTORM_DAMAGE_THREAT === "CONSIDERABLE";
      const thunderstormDamageThreatDestructive = ai.THUNDERSTORM_DAMAGE_THREAT === "DESTRUCTIVE";
      let flashFloodDamageThreat = null;
      if (ai.FLASH_FLOOD_DAMAGE_THREAT === "CATASTROPHIC" || ai.FLASH_FLOOD_DAMAGE_THREAT === "CONSIDERABLE") {
        flashFloodDamageThreat = ai.FLASH_FLOOD_DAMAGE_THREAT;
      }
      return {
        tornadoDetectionRadarIndicated,
        tornadoDetectionObserved,
        tornadoDetection,
        tornadoDamageThreatCatastrophic,
        tornadoDamageThreatConsiderable,
        thunderstormDamageThreatConsiderable,
        thunderstormDamageThreatDestructive,
        flashFloodDamageThreat
      };
    }

    // Helper: Extract damage threats and detection from Atom API parameters (fallback)
    function extractThreatsFromAtom(entry) {
      const parameters = Array.from(entry.getElementsByTagName("cap:parameter"));
      let tornadoDetection = null,
          tornadoDamageThreatCatastrophic = false,
          tornadoDamageThreatConsiderable = false,
          thunderstormDamageThreatConsiderable = false,
          thunderstormDamageThreatDestructive = false,
          flashFloodDamageThreat = null;

      parameters.forEach(p => {
        const name = p.querySelector("valueName")?.textContent || "";
        const val  = p.querySelector("value")?.textContent || "";
        if (name === "tornadoDetection") {
          tornadoDetection = val;
        }
        if (name === "tornadoDamageThreat") {
          if (val === "CATASTROPHIC") tornadoDamageThreatCatastrophic = true;
          if (val === "CONSIDERABLE") tornadoDamageThreatConsiderable = true;
        }
        if (name === "thunderstormDamageThreat") {
          if (val === "CONSIDERABLE") thunderstormDamageThreatConsiderable = true;
          if (val === "DESTRUCTIVE") thunderstormDamageThreatDestructive = true;
        }
        if (name === "flashFloodDamageThreat") {
          if (val === "CATASTROPHIC" || val === "CONSIDERABLE") flashFloodDamageThreat = val;
        }
      });

      return {
        tornadoDetectionRadarIndicated: tornadoDetection === "RADAR INDICATED",
        tornadoDetectionObserved: tornadoDetection === "OBSERVED",
        tornadoDetection,
        tornadoDamageThreatCatastrophic,
        tornadoDamageThreatConsiderable,
        thunderstormDamageThreatConsiderable,
        thunderstormDamageThreatDestructive,
        flashFloodDamageThreat
      };
    }

    // Fetch alerts from new warnverlay API
      // WebSocket logic for warnverlay API
      let wsAlerts = [];
      let wsActive = false;
      let wsError = false;
      let wsSocket = null;
      let wsReconnectTimer = null;
      const WARNVERLAY_WS_URL = "wss://warnverlaynwwsalerts.dpdns.org/ws";

      function scheduleWebSocketReconnect(delay = 5000) {
        if (wsReconnectTimer) return;
        wsReconnectTimer = setTimeout(() => {
          wsReconnectTimer = null;
          startWarnverlayWebSocket();
        }, delay);
      }

      function parseWarnverlayPayload(rawData) {
        let data;
        try {
          data = JSON.parse(String(rawData));
        } catch (e) {
          return null;
        }

        let arr = null;
        if (Array.isArray(data)) arr = data;
        else if (data && Array.isArray(data.alerts)) arr = data.alerts;
        else if (data && Array.isArray(data.data)) arr = data.data;
        else if (data && Array.isArray(data.features)) arr = data.features.map(f => f.properties ? Object.assign({}, f.properties, { alertinfo: f.properties.alertinfo || f.alertinfo }) : f);
        if (!arr) return null;

        return arr.map(alert => {
          const props = alert.properties || {};
          const sender = alert.sender || props.sender || "";
          const officeId = alert.officeId || props.officeId || parseOfficeIdFromSender(sender);
          return {
            id: alert.id || props.common_id || undefined,
            event: alert.event || alert.event_description || "",
            areaDesc: alert.areaDesc || alert.areaDescText || alert.area || "",
            expires: alert.expires || "",
            description: alert.description || "",
            officeId,
            officeName: alert.officeName || props.officeName || nwsofficeMap[officeId] || undefined,
            threats: extractThreatsFromWarnverlay(alert.alertinfo || alert.alertInfo || props.alertinfo || props.alertInfo || {}),
            fields: extractAlertFieldsFromWarnverlay(alert.alertinfo || alert.alertInfo || props.alertinfo || props.alertInfo || {}),
            action: (props.vtec && props.vtec.action) || props.action ||
              (alert.vtec && alert.vtec.action) || alert.action || ""
          };
        });
      }

      function startWarnverlayWebSocket() {
        if (wsSocket && (wsSocket.readyState === WebSocket.OPEN || wsSocket.readyState === WebSocket.CONNECTING)) {
          return;
        }

        try {
          wsSocket = new WebSocket(WARNVERLAY_WS_URL);
          wsActive = false;
          wsError = false;

          wsSocket.addEventListener('open', () => {
            wsActive = true;
            wsError = false;
          });

          wsSocket.addEventListener('message', event => {
            const parsed = parseWarnverlayPayload(event.data);
            if (!parsed) return;
            wsAlerts = parsed;
            try { pollAlerts(); } catch (e) {}
          });

          wsSocket.addEventListener('close', () => {
            wsActive = false;
            scheduleWebSocketReconnect();
          });

          wsSocket.addEventListener('error', () => {
            wsActive = false;
            wsError = true;
            if (wsSocket) {
              wsSocket.close();
            }
          });
        } catch (e) {
          wsActive = false;
          wsError = true;
          scheduleWebSocketReconnect();
        }
      }

      // Start WebSocket on load
      startWarnverlayWebSocket();

      async function fetchWarnverlayAlerts() {
        // If WebSocket is working and has data, use it
        if (wsActive && wsAlerts.length) {
          return wsAlerts;
        }
        // If WebSocket failed, fallback to fetch
        try {
          const resp = await fetch("https://warnverlaynwwsalerts.dpdns.org/alerts");
          if (!resp.ok) return null;
          const data = await resp.json();
          let arr = null;
          if (Array.isArray(data)) arr = data;
          else if (data && Array.isArray(data.alerts)) arr = data.alerts;
          else if (data && Array.isArray(data.data)) arr = data.data;
          else if (data && Array.isArray(data.features)) arr = data.features.map(f => f.properties ? Object.assign({}, f.properties, { alertinfo: f.properties.alertinfo || f.alertinfo }) : f);
          if (!arr) return null;
          return arr.map(alert => {
            const props = alert.properties || {};
            const sender = alert.sender || props.sender || "";
            const officeId = alert.officeId || props.officeId || parseOfficeIdFromSender(sender);
            return {
              id: alert.id || props.common_id || undefined,
              event: alert.event || alert.event_description || "",
              areaDesc: alert.areaDesc || alert.areaDescText || alert.area || "",
              expires: alert.expires || "",
              description: alert.description || "",
              officeId,
              officeName: alert.officeName || props.officeName || nwsofficeMap[officeId] || undefined,
              threats: extractThreatsFromWarnverlay(alert.alertinfo || alert.alertInfo || props.alertinfo || props.alertInfo || {}),
              fields: extractAlertFieldsFromWarnverlay(alert.alertinfo || alert.alertInfo || props.alertinfo || props.alertInfo || {}),
              action: (props.vtec && props.vtec.action) || props.action ||
                (alert.vtec && alert.vtec.action) || alert.action || ""
            };
          });
        } catch (e) {
          return null;
        }
      }

      async function fetchMesoscaleDiscussions() {
        try {
          const response = await fetch("https://warnverlaynwwsalerts.dpdns.org/mesoscalediscussions");
          if (!response.ok) return [];
          const data = await response.json();
          const discussions = Array.isArray(data) ? data :
            data && (Array.isArray(data.discussions) ? data.discussions : Array.isArray(data.data) ? data.data : []);
          return discussions.flatMap(discussion => {
            const discussionType = String(discussion.type || discussion.TYPE || "").toUpperCase();
            if (discussionType !== "MCD" && discussionType !== "MPD") return [];
            return [{
              id: discussion.id || discussion.sent || undefined,
              discussionType,
              event: discussionType === "MCD" ? "Mesoscale Discussion" : "Mesoscale Percipitation Discussion",
              areaDesc: discussion.AREAS_AFFECTED || discussion.AREA_AFFECTED || "",
              concerning: discussion.CONCERNING || discussion.CONSERNING || "",
              watchProbability: discussion.WATCH_PROBABILITY ?? "",
              mostProbablePeakTornadoIntensity: discussion.MOST_PROBABLE_PEAK_TORNADO_INTENSITY ?? "",
              mostProbablePeakWindGust: discussion.MOST_PROBABLE_PEAK_WIND_GUST ?? "",
              expires: discussion.expires || discussion.endTime || "",
              threats: {}
            }];
          });
        } catch (error) {
          return [];
        }
      }

    // Fetch alerts from NWS API (weather.gov only)
    async function fetchNWSAlerts() {
      try {
        const resp = await fetch("https://api.weather.gov/alerts/active.atom");
        const str = await resp.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(str, "application/xml");
        const entries = Array.from(xml.getElementsByTagName("entry"));
        return entries.map(entry => {
          const eventEl = entry.querySelector("cap\\:event") || entry.querySelector("event");
          const areaEl  = entry.querySelector("cap\\:areaDesc") || entry.querySelector("areaDesc");
          const descEl  = entry.querySelector("summary") || entry.querySelector("description");
          const idEl    = entry.querySelector("cap\\:identifier") || entry.querySelector("id");
          const rawId = idEl ? (idEl.textContent || "").trim() : "";
          const officeId = getOfficeIdFromWMOIdentifier(rawId);
          return {
            id: rawId || undefined,
            event: eventEl ? eventEl.textContent.trim() : "",
            areaDesc: areaEl ? areaEl.textContent.trim() : "",
            expires: entry.querySelector("cap\\:expires")?.textContent || "",
            description: descEl ? descEl.textContent : "",
            officeId,
            officeName: nwsofficeMap[officeId] || undefined,
            threats: extractThreatsFromAtom(entry),
            fields: extractAlertFieldsFromAtom(entry)
          };
        });
      } catch (e) {
        return [];
      }
    }

    // Unified fetch function: try warnverlay, fallback to Atom
    async function fetchWeatherAlerts() {
      let alerts = await fetchWarnverlayAlerts();
      // If warnverlay is down/unreachable we return `null` from fetchWarnverlayAlerts
      // and should fall back to the NWS Atom feed. If warnverlay is up but
      // returns an empty array, treat that as "no alerts" (do not fallback).
      if (alerts === null) {
        alerts = await fetchNWSAlerts();
      }
      const discussions = await fetchMesoscaleDiscussions();
      return [...alerts, ...discussions];
    }

    // Main pollAlerts logic: use unified fetchWeatherAlerts
    async function pollAlerts() {
      if (pollInProgress) {
        pollRequested = true;
        return;
      }
      pollInProgress = true;
      pollRequested = false;
      let scheduled = false;
      try {
        let alerts = await fetchWeatherAlerts();
        if (Array.isArray(alerts) && alerts.length) {
          const filtered = applyOfficeFilters(alerts);
          registerOfficesFromAlerts(filtered);
          alerts = filtered;
        }
        if (!alerts || !alerts.length) {
          // no alerts yet – poll again sooner
          setTimeout(() => { pollInProgress = false; pollAlerts(); }, 1800);
          scheduled = true;
          return;
        }

        const currentFeedKeys    = new Set();
        const processedThisCycle = new Set();

        alerts.forEach(alert => {
        function enqueueAlert(options) {
          return enqueueAlertRaw({ ...options, alertFields: alert.fields || {} });
        }

        const eventTextRaw = alert.event || "";
        const areaDesc     = alert.areaDesc || "";
        const expireDate   = alert.expires || "";
        const threats      = alert.threats;
        const action       = String(alert.action || "").trim().toUpperCase();

        // Keep the full county list together; the display scrolls when it overflows.
        const groups = [formatAreaDesc(areaDesc)].filter(group => passesStateFilter(group));
        if (!groups.length) return;

        // Helper for upgrade logic: returns true if a new threat/detection was added
        function isThreatUpgrade(last, current, type) {
          // For tornado: EMERGENCY > PDS > OBSERVED > DEFAULT
          // For severe: DESTRUCTIVE > CONSIDERABLE > DEFAULT
          // For flash flood: CATASTROPHIC > CONSIDERABLE > DEFAULT
          const tornadoOrder = ["DEFAULT", "OBSERVED", "PDS", "EMERGENCY"];
          const severeOrder = ["DEFAULT", "CONSIDERABLE", "DESTRUCTIVE"];
          const ffOrder = ["DEFAULT", "CONSIDERABLE", "CATASTROPHIC"];
          let arr = [];
          if (type === "tornado") arr = tornadoOrder;
          if (type === "severe") arr = severeOrder;
          if (type === "flashFlood") arr = ffOrder;
          return arr.indexOf(current) > arr.indexOf(last);
        }

        if (alert.discussionType === "MCD" || alert.discussionType === "MPD") {
          const isPrecipitationDiscussion = alert.discussionType === "MPD";
          const discussionType = isPrecipitationDiscussion ?
            "mesoscalePrecipitationDiscussion" : "mesoscaleDiscussion";
          const issuedMap = isPrecipitationDiscussion ?
            issuedMesoscalePrecipitationDiscussionAlerts : issuedMesoscaleDiscussionAlerts;
          const key = generateAlertKey(alert.event, areaDesc, alert.id);
          currentFeedKeys.add(key);
          if (!issuedMap[key]) {
            if (initialLoad) {
              issuedMap[key] = { state: "DEFAULT", queued: false, lastDisplayed: "DEFAULT" };
            } else {
              enqueueAlert({
                alertKey: key,
                eventText: alert.event,
                areaDesc,
                concerning: alert.concerning || "",
                watchProbability: alert.watchProbability ?? "",
                mostProbablePeakTornadoIntensity: alert.mostProbablePeakTornadoIntensity ?? "",
                mostProbablePeakWindGust: alert.mostProbablePeakWindGust ?? "",
                type: discussionType,
                state: "DEFAULT"
              });
              issuedMap[key] = { state: "DEFAULT", queued: true, lastDisplayed: "DEFAULT" };
            }
          }
          return;
        }

        // SEVERE THUNDERSTORM WARNING
        if (eventTextRaw.toLowerCase().includes("severe thunderstorm warning") &&
            alertCategoryToggles["severe thunderstorm warning"] !== false) {
          const baseEventText = "Severe Thunderstorm Warning";
          let currentThreat = "DEFAULT";
          if (threats.thunderstormDamageThreatDestructive) currentThreat = "DESTRUCTIVE";
          else if (threats.thunderstormDamageThreatConsiderable) currentThreat = "CONSIDERABLE";

          groups.forEach(group => {
            const key = generateAlertKey(baseEventText, group, alert.id);
            if (processedThisCycle.has(key)) return;
            processedThisCycle.add(key);
            currentFeedKeys.add(key);

            const record = issuedSevereAlerts[key];
            if (initialLoad) {
              issuedSevereAlerts[key] = {
                state: currentThreat,
                queued: false,
                lastDisplayed: currentThreat
              };
            } else if (!record) {
              // Only overlay immediately if the feed reports this as NEW, but only for non-damage threat alerts
              if (
                (currentThreat === "DEFAULT" && action === "NEW") ||
                currentThreat === "CONSIDERABLE" ||
                currentThreat === "DESTRUCTIVE"
              ) {
                let text, img, aud;
                if (currentThreat==="DESTRUCTIVE") {
                  text = "PDS Severe Thunderstorm Warning - Destructive";
                  img = "PDS SVR.gif";
                  aud = "PDS SVR.mp3";
                } else if (currentThreat==="CONSIDERABLE") {
                  text = "Severe Thunderstorm Warning – Considerable";
                  img = "SVR - Considerable.gif";
                  aud = "SVR.mp3";
                } else {
                  text = "Severe Thunderstorm Warning";
                  img = "SVR.gif";
                  aud = "SVR.mp3";
                }

                enqueueAlert({
                  alertKey: key,
                  imageSrc: img,
                  audioSrc: aud,
                  eventText: text,
                  areaDesc: group,
                  type: "severe",
                  state: currentThreat,
                  destructive: currentThreat==="DESTRUCTIVE",
                  considerable: currentThreat==="CONSIDERABLE"
                });
                issuedSevereAlerts[key] = {
                  state: currentThreat,
                  queued: true,
                  lastDisplayed: currentThreat
                };
              } else {
                // Register silently so future upgrades are detected
                issuedSevereAlerts[key] = {
                  state: currentThreat,
                  queued: false,
                  lastDisplayed: currentThreat
                };
              }
            } else if (record.lastDisplayed !== currentThreat) {
              // Overlay if a new threat was added (upgrade)
              if (isThreatUpgrade(record.lastDisplayed, currentThreat, "severe")) {
                let text, img, aud;
                if (currentThreat==="DESTRUCTIVE") {
                  text = "PDS Severe Thunderstorm Warning - Destructive Upgraded";
                  img = "PDS SVR.gif";
                  aud = "PDS SVR.mp3";
                } else if (currentThreat==="CONSIDERABLE") {
                  text = "Severe Thunderstorm Warning – Considerable Upgraded";
                  img = "SVR - Considerable.gif";
                  aud = "SVR.mp3";
                } else {
                  text = "Severe Thunderstorm Warning Upgraded";
                  img = "SVR.gif";
                  aud = "SVR.mp3";
                }
                enqueueAlert({
                  alertKey: key,
                  imageSrc: img,
                  audioSrc: aud,
                  eventText: text,
                  areaDesc: group,
                  type: "severe",
                  state: currentThreat,
                  destructive: currentThreat==="DESTRUCTIVE",
                  considerable: currentThreat==="CONSIDERABLE",
                  force: true
                });
                record.lastDisplayed = currentThreat;
              } else {
                // No overlay: just update record so we don't repeatedly trigger
                record.lastDisplayed = currentThreat;
              }
            }
          });
        }

        // TORNADO WARNING
        else if (eventTextRaw.toLowerCase().includes("tornado warning") &&
            alertCategoryToggles["tornado warning"] !== false) {
          const baseEventText = "Tornado Warning";
          let currentState = "DEFAULT";
          if (threats.tornadoDetection === "OBSERVED" && threats.tornadoDamageThreatCatastrophic) {
            currentState = "EMERGENCY";
          } else if (
            (threats.tornadoDetection === "OBSERVED" || threats.tornadoDetection === "RADAR INDICATED") &&
            threats.tornadoDamageThreatConsiderable
          ) {
            currentState = "PDS";
          } else if (threats.tornadoDetection === "OBSERVED") {
            currentState = "OBSERVED";
          }

          groups.forEach(group => {
            const key = generateAlertKey(baseEventText, group, alert.id);
            if (processedThisCycle.has(key)) return;
            processedThisCycle.add(key);
            currentFeedKeys.add(key);

            const record = issuedTornadoAlerts[key];
            if (initialLoad) {
              issuedTornadoAlerts[key] = {
                state: currentState,
                queued: false,
                lastDisplayed: currentState
              };
            } else if (!record) {
              // Only overlay immediately if action === "NEW"
              if (action === "NEW") {
                let text, img, aud, pds=false, em=false;
                if (currentState==="EMERGENCY") {
                  em = true; text = "Tornado Emergency"; img = "TORE.gif"; aud = "TORE.mp3";
                } else if (currentState==="PDS") {
                  pds = true; text = "PDS Tornado Warning"; img = "PDS TOR.gif"; aud = "PDS TOR.mp3";
                } else if (currentState==="OBSERVED") {
                  text = "Observed Tornado Warning"; img = "TOR.gif"; aud = "TOR.mp3";
                } else {
                  text = "Tornado Warning"; img = "TOR.gif"; aud = "TOR.mp3";
                }

                enqueueAlert({
                  alertKey: key,
                  imageSrc: img,
                  audioSrc: aud,
                  eventText: text,
                  areaDesc: group,
                  type: "tornado",
                  state: currentState,
                  pds,
                  emergency: em
                });
                issuedTornadoAlerts[key] = {
                  state: currentState,
                  queued: true,
                  lastDisplayed: currentState
                };
              } else {
                // Register silently so future upgrades/detections are handled
                issuedTornadoAlerts[key] = {
                  state: currentState,
                  queued: false,
                  lastDisplayed: currentState
                };
              }
            } else if (record.lastDisplayed !== currentState) {
              // Overlay if a new detection/threat was added (upgrade)
              if (isThreatUpgrade(record.lastDisplayed, currentState, "tornado")) {
                let text, img, aud, pds=false, em=false;
                if (currentState==="EMERGENCY") {
                  em = true; text = "Tornado Emergency Upgraded"; img = "TORE.gif"; aud = "TORE Upgraded.mp3";
                } else if (currentState==="PDS") {
                  pds = true; text = "PDS Tornado Warning Upgraded"; img = "PDS TOR.gif"; aud = "PDS TOR - TOR Upgraded.mp3";
                } else if (currentState==="OBSERVED") {
                  text = "Observed Tornado Warning Upgraded"; img = "TOR.gif"; aud = "PDS TOR - TOR Upgraded.mp3";
                } else {
                  text = "Tornado Warning Upgraded"; img = "TOR.gif"; aud = "TOR.mp3";
                }
                enqueueAlert({
                  alertKey: key,
                  imageSrc: img,
                  audioSrc: aud,
                  eventText: text,
                  areaDesc: group,
                  type: "tornado",
                  state: currentState,
                  pds,
                  emergency: em,
                  force: true
                });
                record.lastDisplayed = currentState;
              } else {
                // No overlay: update record silently

              }
            }
          });

        // FLASH FLOOD WARNING
        else if (eventTextRaw.toLowerCase().includes("flash flood warning") &&
            alertCategoryToggles["flash flood warning"] !== false) {
          const baseEventText = "Flash Flood Warning";
          let currentFF = "DEFAULT";
          if (threats.flashFloodDamageThreat === "CATASTROPHIC") currentFF = "CATASTROPHIC";
          else if (threats.flashFloodDamageThreat === "CONSIDERABLE") currentFF = "CONSIDERABLE";

          groups.forEach(group => {
            const key = generateAlertKey(baseEventText, group, alert.id); // <--- pass id
            if (processedThisCycle.has(key)) return;

            const record = issuedFlashFloodAlerts[key];
            // --- Warnverlay API logic with action ---

            } else if (!record) {

                } else if (currentFF==="CONSIDERABLE") {

              if (isThreatUpgrade(record.lastDisplayed, currentFF, "flashFlood")) {
                let text, img, aud;
                if (currentFF==="CATASTROPHIC") {
                  text = "Flash Flood Emergency Upgraded"; img = "FFWE.gif"; aud = "FFWE Upgraded.mp3";

                  text = "Flash Flood Warning - Considerable Upgraded"; img = "FFW - Considerable.gif"; aud = "FFW - Considerable Upgraded.mp3";

                enqueueAlert({

                });

              } else {

          });

        // SPECIAL WEATHER STATEMENT
        else if (eventTextRaw.toLowerCase().includes("special weather statement")) {
          const baseEventText = "Special Weather Statement";

            const key = generateAlertKey(baseEventText, group, undefined);
            if (processedThisCycle.has(key)) return;
            processedThisCycle.add(key);

            const record = issuedSpecialStatementAlerts[key];
            if (initialLoad) {
              issuedSpecialStatementAlerts[key] = {
                state: "DEFAULT",
                queued: false,
                lastDisplayed: "DEFAULT"
              };
            } else if (!record) {
                enqueueAlert({
                  alertKey: key,

                  audioSrc: "SWS.mp3",
                  eventText: "Special Weather Statement",
                  areaDesc: group,
                  type: "specialStatement",
                  state: "DEFAULT"
                });
                issuedSpecialStatementAlerts[key] = {
                  state: "DEFAULT",
                  queued: true,
                  lastDisplayed: "DEFAULT"
                };
            }
            // No upgrade logic for SWS
          });
        }

        // SEVERE THUNDERSTORM WATCH
        else if (eventTextRaw.toLowerCase().includes("severe thunderstorm watch")) {
