<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pop Up Alerts</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    html { font-size: min(0.833333vw, 1.481481vh); }
    body { font-family: Arial, sans-serif; }

    #overlay {
      display: none;
      position: fixed;
      left: 50%;
      top: 50%;
      width: min(100vw, calc(100vh * (16 / 9)));
      height: min(100vh, calc(100vw * (9 / 16)));
      aspect-ratio: 16 / 9;
      transform: translate(-50%, -50%);
      overflow: hidden;
      background-color: rgba(0,0,0,0);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
    }

    #overlay img {
      max-width: 90%; max-height: 90%;
      opacity: 1;
      transition: opacity 1.5s ease-in-out;
    }

    #popupCustomLayer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      aspect-ratio: 16 / 9;
      z-index: 1;
      pointer-events: none;
      overflow: visible;
    }

    #popupCustomLayer .popup-custom-box,
    #popupCustomLayer .popup-custom-media {
      position: absolute;
      box-sizing: border-box;
      pointer-events: none;
    }

    #popupCustomLayer .popup-custom-box { overflow: visible; }
    #popupCustomLayer .popup-custom-surface {
      position: absolute;
      inset: 0;
      box-sizing: border-box;
      transform-origin: 0 0;
      pointer-events: none;
    }
    #popupCustomLayer .popup-custom-motion {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #popupCustomLayer .popup-custom-motion > span {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 0.25rem;
      white-space: pre-wrap;
    }
    #popupCustomLayer .popup-custom-text-content {
      display: block;
      width: 100%;
      text-align: inherit;
      white-space: pre-wrap;
    }
    #popupCustomLayer .popup-discussion-text-content {
      min-width: 0;
      overflow: hidden;
      white-space: pre;
    }
    #popupCustomLayer .popup-area-viewport {
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      white-space: nowrap;
      text-align: left;
      vertical-align: bottom;
    }
    #popupCustomLayer .popup-area-text { display: inline-block; white-space: nowrap; }
    #popupCustomLayer .popup-area-marquee {
      display: inline-flex;
      width: max-content;
    }
    #popupCustomLayer .popup-area-marquee > span {
      flex: none;
      padding-right: 2em;
    }
    #popupCustomLayer .popup-custom-media img,
    #popupCustomLayer .popup-custom-media video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    @keyframes popup-box-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes popup-box-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-0.375rem); } }
    @keyframes popup-box-zoom { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @keyframes popup-light-sweep { 0% { background-position: -40% 50%; } 100% { background-position: 140% 50%; } }

    .text-container {
      position: absolute;
      font-size: 2.3rem;
      font-weight: bold;
      font-family: 'Bebas Neue', sans-serif;
      text-align: center;
      opacity: 0;
      transition: opacity 2s ease-in-out;
      color: rgb(255,255,255);
    }

    #testCountyContainer {
      width: 80%;
      max-width: 90%;
      overflow: hidden;
      white-space: nowrap;
      box-sizing: border-box;
    }
    #testCountyContainer.marquee-active { text-align: left; }

    .alert-area-marquee {
      display: inline-flex;
      width: max-content;
    }
    .alert-area-marquee > span {
      flex: none;
      padding-right: 2em;
    }

    /* Severe Thunderstorm Warning */
    .severe#testWarningContainer {
      top: 78.1%; left: 59.2%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
    }
    .severe#testCountyContainer {
      top: 81.6%; left: 58.9%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
      font-size: 1.3rem;
    }
    .considerableSevere#testWarningContainer { color: rgb(255, 255, 255) !important; }
    .considerableSevere#testCountyContainer { color: rgb(255, 255, 255) !important; }
    .destructiveSevere#testWarningContainer { color: rgb(255, 255, 255) !important; }
    .destructiveSevere#testCountyContainer { color: rgb(255, 255, 255) !important; }

    /* Flash Flood Warning */
    .flashFlood#testWarningContainer {
      top: 78.1%; left: 59.2%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
    }
    .flashFlood#testCountyContainer {
      top: 81.6%; left: 58.9%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
      font-size: 1.3rem;
    }
    .considerableFlashFlood#testWarningContainer { color: rgb(255, 255, 255) !important; }
    .considerableFlashFlood#testCountyContainer { color: rgb(255, 255, 255) !important; }
    .catastrophicFlashFlood#testWarningContainer { color: rgb(255, 255, 255) !important; }
    .catastrophicFlashFlood#testCountyContainer { color: rgb(255, 255, 255) !important; }

    /* Tornado Warning */
    .tornado#testWarningContainer {
      top: 78.1%; left: 59.2%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
    }
    .tornado#testCountyContainer {
      top: 81.6%; left: 58.9%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
      font-size: 1.3rem;
    }
    .pdsTornado#testWarningContainer { color: rgb(255, 255, 255) !important; }
    .pdsTornado#testCountyContainer { color: rgb(255, 255, 255) !important; }
    .tornadoEmergency#testWarningContainer { color: rgb(255, 255, 255) !important; }
    .tornadoEmergency#testCountyContainer { color: rgb(255, 255, 255) !important; }

    /* Special Weather Statement */
    .specialStatement#testWarningContainer {
      top: 78.1%; left: 59.2%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
    }
    .specialStatement#testCountyContainer {
      top: 81.6%; left: 58.9%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
      font-size: 1.3rem;
    }

    /* Severe Thunderstorm Watch */
    .severeWatch#testWarningContainer {
      top: 78.1%; left: 59.2%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
    }
    .severeWatch#testCountyContainer {
      top: 81.6%; left: 58.9%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
      font-size: 1.3rem;
    }

    /* Tornado Watch */
    .tornadoWatch#testWarningContainer {
      top: 78.1%; left: 59.2%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
    }
    .tornadoWatch#testCountyContainer {
      top: 81.6%; left: 58.9%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
      font-size: 1.3rem;
    }

    /* Winter Storm Warning */
    .winterStorm#testWarningContainer {
      top: 78.1%; left: 59.2%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
    }
    .winterStorm#testCountyContainer {
      top: 81.6%; left: 58.9%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
      font-size: 1.3rem;
    }

    /* Blizzard Warning */
    .blizzard#testWarningContainer {
      top: 78.1%; left: 59.2%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
    }
    .blizzard#testCountyContainer {
      top: 81.6%; left: 58.9%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
      font-size: 1.3rem;
    }

    /* Tropical Storm Warning */
    .tropicalStorm#testWarningContainer {
      top: 78.1%; left: 59.2%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255); /* event text color as requested */
    }
    .tropicalStorm#testCountyContainer {
      top: 81.6%; left: 58.9%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255); /* areadesc color as requested */
      font-size: 1.3rem;
    }

    /* Hurricane Warning */
    .hurricane#testWarningContainer {
      top: 78.1%; left: 59.2%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255); /* event text color as requested */
    }
    .hurricane#testCountyContainer {
      top: 81.6%; left: 58.9%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255); /* areadesc color as requested */
      font-size: 1.3rem;
    }

    /* Snow Squall Warning */
    .snowSquall#testWarningContainer {
      top: 78.1%; left: 59.2%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255); /* event text color requested */
    }
    .snowSquall#testCountyContainer {
      top: 81.6%; left: 58.9%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255); /* areadesc color requested */
      font-size: 1.3rem;
    }

    /* Winter Storm Watch */
    .winterWatch#testWarningContainer {
      top: 78.1%; left: 59.2%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255); /* event text color */
    }
    .winterWatch#testCountyContainer {
      top: 81.6%; left: 58.9%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255); /* areadesc color */
      font-size: 1.3rem;
    }
    @keyframes glow-pulse {
      0% { box-shadow: 0 0 10px rgba(255, 50, 50, 0.5), inset 0 0 10px rgba(255, 50, 50, 0.2); }
      50% { box-shadow: 0 0 20px rgba(255, 50, 50, 0.8), inset 0 0 15px rgba(255, 50, 50, 0.3); }
      100% { box-shadow: 0 0 10px rgba(255, 50, 50, 0.5), inset 0 0 10px rgba(255, 50, 50, 0.2); }
    }
    @keyframes menu-glow {
      0%, 100% { box-shadow: 0 0 15px rgba(255, 50, 50, 0.6), 0 0 30px rgba(255, 50, 50, 0.3), inset 0 0 20px rgba(255, 50, 50, 0.1); }
      50% { box-shadow: 0 0 25px rgba(255, 50, 50, 0.9), 0 0 40px rgba(255, 50, 50, 0.5), inset 0 0 30px rgba(255, 50, 50, 0.2); }
    }
    #menu-icon {
      position: fixed; top: 10px; left: 10px; width: 40px; height: 40px;
      cursor: pointer; z-index: 10000; background: linear-gradient(135deg, rgba(100, 20, 20, 0.8), rgba(150, 50, 50, 0.8));
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      animation: glow-pulse 2s ease-in-out infinite; border: 2px solid rgba(255, 50, 50, 0.6);
      transition: all 0.3s ease; opacity: 0; pointer-events: none;
    }
    html:hover #menu-icon, body:hover #menu-icon { opacity: 1; pointer-events: auto; }
    #menu-icon:hover { box-shadow: 0 0 30px rgba(255, 50, 50, 1), 0 0 60px rgba(255, 50, 50, 0.5); border-color: rgba(255, 100, 100, 1); }
    #menu-icon span {
      display: block; width: 24px; height: 3px; background: white; margin: 3px 0;
      transition: 0.4s; box-shadow: 0 0 5px rgba(255, 50, 50, 0.8);
    }
    #alert-menu {
      position: fixed; top: 60px; left: 10px; width: 280px;
      background: linear-gradient(135deg, rgba(80, 10, 10, 0.95), rgba(120, 20, 20, 0.95));
      padding: 15px; border-radius: 8px; z-index: 9000; display: none; max-height: 80vh;
      overflow-y: scroll; overflow-x: hidden; color: white; border: 1.5px solid rgba(255, 50, 50, 0.5);
      animation: menu-glow 3s ease-in-out infinite;
      box-shadow: 0 0 20px rgba(255, 50, 50, 0.4), inset 0 0 20px rgba(255, 50, 50, 0.1);
      scrollbar-width: thin; scrollbar-color: rgba(255, 50, 50, 0.8) rgba(80, 10, 10, 0.5);
    }
    #alert-menu::-webkit-scrollbar { width: 12px; }
    #alert-menu::-webkit-scrollbar-track { background: rgba(80, 10, 10, 0.5); border-radius: 6px; }
    #alert-menu::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(255, 100, 100, 0.8), rgba(255, 50, 50, 0.8));
      border-radius: 6px; border: 1px solid rgba(255, 50, 50, 0.6);
    }
    .menu-group { margin-bottom: 20px; position: relative; z-index: 1; }
    .menu-group h3 {
      margin: 10px 0 8px; font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem;
      border-bottom: 2px solid rgba(255, 50, 50, 0.6); padding-bottom: 5px;
      color: rgba(255, 100, 100, 1); text-shadow: 0 0 10px rgba(255, 50, 50, 0.6);
    }
    .alert-toggle {
      cursor: pointer; display: flex; align-items: center; border: 1.5px solid rgba(255, 50, 50, 0.5);
      padding: 8px 12px; border-radius: 6px;
      background: linear-gradient(135deg, rgba(150, 50, 50, 0.3), rgba(130, 30, 30, 0.3));
      color: white; font-family: 'Bebas Neue', sans-serif; font-size: 0.9rem;
      margin-bottom: 6px; transition: all 0.3s ease; position: relative; overflow: hidden;
    }
    .alert-toggle:hover {
      background: linear-gradient(135deg, rgba(200, 80, 80, 0.5), rgba(170, 50, 50, 0.5));
      border-color: rgba(255, 100, 100, 0.8); box-shadow: 0 0 15px rgba(255, 50, 50, 0.6);
    }
    .toggle-icon {
      margin-right: 8px; width: 34px; height: 24px; border-radius: 4px;
      background: linear-gradient(135deg, #00ff00, #00cc00); display: inline-flex;
      align-items: center; justify-content: center; color: white; font-size: 0.75rem;
      font-weight: bold; box-shadow: 0 0 8px rgba(0, 255, 0, 0.6); transition: all 0.3s ease;
    }
    .toggle-icon.disabled { background: linear-gradient(135deg, #ff3333, #cc0000); box-shadow: 0 0 8px rgba(255, 0, 0, 0.6); }
  </style>
</head>
<body>
  <script src="./popup-alert-customizations.js"></script>
  <div id="overlay">
    <img id="overlayImage" src="" alt="Warning Image" />
    <div id="popupCustomLayer" aria-hidden="true"></div>
    <audio id="overlayAudio" preload="auto"></audio>
    <div id="testWarningContainer" class="text-container severe"></div>
    <div id="testCountyContainer"  class="text-container severe"></div>
  </div>
  <div id="menu-icon">
    <span></span><span></span><span></span>
  </div>
  <div id="alert-menu">
    <div class="menu-group">
      <h3>Alert Categories</h3>
      <div id="alert-category-list"></div>
    </div>
    <div class="menu-group" id="state-group">
      <h3>State Filters</h3>
    </div>
    <div class="menu-group" id="office-filter-group">
      <h3>Office Filters</h3>
      <input id="office-search" type="text" placeholder="Search offices or ID" style="width:100%; box-sizing:border-box; padding:8px; margin:10px 0 8px; border-radius:6px; border:1px solid rgba(255,50,50,0.5);" />
      <div id="office-list" style="max-height:220px; overflow-y:auto; margin-top:8px;"></div>
    </div>
  </div>

  <script>

    // Fix: define swsNewIds to prevent ReferenceError and restore pop-up alerts
    let alertQueue = [], isOverlayActive = false, initialLoad = true;
    let pollInProgress = false;
    let pollRequested = false;

    const issuedSevereAlerts       = {};
    const issuedTornadoAlerts      = {};
    const issuedFlashFloodAlerts   = {};
    const issuedSpecialStatementAlerts = {}; // Add tracking for SWS
    const issuedSevereWatchAlerts  = {}; // Add tracking for SVA
    const issuedTornadoWatchAlerts = {}; // Add tracking for TOA
    const issuedWinterStormAlerts  = {}; // Add tracking for WSW
    const issuedBlizzardAlerts     = {}; // Add tracking for BZW
    const issuedTropicalStormAlerts = {}; // NEW: tracking for Tropical Storm Warnings
    const issuedHurricaneAlerts     = {}; // NEW: tracking for Hurricane Warnings
    const issuedSnowSquallAlerts    = {}; // NEW: tracking for Snow Squall Warnings
    const issuedWinterWatchAlerts   = {}; // NEW: tracking for Winter Storm Watch (WSA)
    const issuedMesoscaleDiscussionAlerts = {};
    const issuedMesoscalePrecipitationDiscussionAlerts = {};
    const issuedCustomAlerts = {};
    const issuedDustStormAlerts = {};

    const lastQueuedTime = {
      tornado: 0,
      severe: 0,
      flashFlood: 0,
      specialStatement: 0, // Add SWS throttle
      severeWatch: 0, // Add SVA throttle
      tornadoWatch: 0, // Add TOA throttle
      winterStorm: 0, // Add WSW throttle
      blizzard: 0, // Add BZW throttle
      tropicalStorm: 0,
      hurricane: 0,
      snowSquall: 0,
      winterWatch: 0, // NEW throttle entry for WSA
      mesoscaleDiscussion: 0,
      mesoscalePrecipitationDiscussion: 0,
      dustStorm: 0,
      custom: 0
    };
    const throttleDelay = 0;

    const STORAGE_KEYS = { offices: "popupalertsmyown_officeToggles" };
    let alertCategoryToggles = {};
    let selectedOfficeIds = [];
    let officeToggles = {};
    let nwsofficeMap = {};
    let stateToggles = {
      "AL": true, "AK": true, "AZ": true, "AR": true, "CA": true,
      "CO": true, "CT": true, "DE": true, "FL": true, "GA": true,
      "HI": true, "ID": true, "IL": true, "IN": true, "IA": true,
      "KS": true, "KY": true, "LA": true, "ME": true, "MD": true,
      "MA": true, "MI": true, "MN": true, "MS": true, "MO": true,
      "MT": true, "NE": true, "NV": true, "NH": true, "NJ": true,
      "NM": true, "NY": true, "NC": true, "ND": true, "OH": true,
      "OK": true, "OR": true, "PA": true, "RI": true, "SC": true,
      "SD": true, "TN": true, "TX": true, "UT": true, "VT": true,
      "VA": true, "WA": true, "WV": true, "WI": true, "WY": true,
      "GU": true, "PR": true, "VI": true, "AS": true, "MP": true
    };

    async function loadNWSOffices() {
      try {
        const resp = await fetch("nwsoffices.json");
        if (!resp.ok) return;
        const list = await resp.json();
        if (!Array.isArray(list)) return;
        list.forEach(office => {
          if (!office || !office.officeId) return;
          const id = office.officeId.toUpperCase();
          nwsofficeMap[id] = office.name || id;
          if (!officeToggles[id]) officeToggles[id] = { name: office.name || id, enabled: false };
        });
      } catch (error) {
        console.warn("Could not load nwsoffices.json", error);
      }
    }

    function saveSettings() {
      try {
        localStorage.setItem(STORAGE_KEYS.offices, JSON.stringify(officeToggles));
      } catch (error) {
        console.warn("Could not save office settings", error);
      }
    }

    function loadSettings() {
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEYS.offices) || "{}");
        if (stored && typeof stored === "object") {
          Object.keys(stored).forEach(id => {
            const up = id.toUpperCase();
            officeToggles[up] = Object.assign(officeToggles[up] || {}, stored[id]);
          });
        }
        selectedOfficeIds = Object.keys(officeToggles).filter(id => officeToggles[id] && officeToggles[id].enabled);
      } catch (error) {
        console.warn("Could not load office settings", error);
      }
    }

    function formatOfficeDisplayName(officeId, office) {
      const up = (officeId || "").toUpperCase();
      const name = nwsofficeMap[up] || (office && office.name) || up;
      return `${name} (${up})`;
    }

    function registerOffice(officeId, officeName) {
      if (!officeId) return;
      const up = officeId.toUpperCase();
      if (!officeToggles[up]) {
        officeToggles[up] = { name: officeName || nwsofficeMap[up] || up, enabled: false };
      } else if (officeName && (!officeToggles[up].name || officeToggles[up].name === up)) {
        officeToggles[up].name = officeName;
      }
    }

    function registerOfficesFromAlerts(alerts) {
      if (!Array.isArray(alerts)) return;
      alerts.forEach(alert => {
        if (alert && alert.officeId) registerOffice(alert.officeId, alert.officeName);
      });
      updateOfficeFilterUI();
    }

    function updateOfficeFilterUI() {
      const container = document.getElementById("office-list");
      if (!container) return;
      container.innerHTML = "";
      const search = document.getElementById("office-search");
      const term = search ? (search.value || "").trim().toLowerCase() : "";
      let ids = Object.keys(officeToggles).sort((a, b) =>
        formatOfficeDisplayName(a, officeToggles[a]).localeCompare(formatOfficeDisplayName(b, officeToggles[b])));
      if (term) {
        ids = ids.filter(id => {
          const name = formatOfficeDisplayName(id, officeToggles[id]).toLowerCase();
          return id.toLowerCase().includes(term) || name.includes(term);
        });
      }
      if (!ids.length) {
        const placeholder = document.createElement("div");
        placeholder.className = "alert-toggle";
        placeholder.style.cursor = "default";
        placeholder.innerHTML = '<span class="toggle-icon">--</span><span>No office data yet</span>';
        container.appendChild(placeholder);
        return;
      }
      ids.forEach(id => {
        const office = officeToggles[id];
        const div = document.createElement("div");
        div.className = "alert-toggle";
        div.setAttribute("data-officeid", id);
        div.innerHTML = `<span class="toggle-icon">${office.enabled ? "ON" : "OFF"}</span><span>${formatOfficeDisplayName(id, office)}</span>`;
        div.classList.toggle("selected", office.enabled);
        const icon = div.querySelector(".toggle-icon");
        icon.classList.toggle("disabled", !office.enabled);
        div.addEventListener("click", () => {
          office.enabled = !office.enabled;
          div.classList.toggle("selected", office.enabled);
          icon.textContent = office.enabled ? "ON" : "OFF";
          icon.classList.toggle("disabled", !office.enabled);
          selectedOfficeIds = Object.keys(officeToggles).filter(key => officeToggles[key].enabled);
          saveSettings();
        });
        container.appendChild(div);
      });
    }

    function applyOfficeFilters(alerts) {
      if (!selectedOfficeIds.length) return alerts;
      return alerts.filter(alert => !alert.officeId || selectedOfficeIds.includes(alert.officeId.toUpperCase()));
    }

    function parseOfficeIdFromSender(sender) {
      if (!sender) return "";
      const token = String(sender).split(/[@\s]+/).find(Boolean);
      return token ? token.toUpperCase() : "";
    }

    function getOfficeIdFromWMOIdentifier(identifier) {
      if (!identifier) return "";
      const parts = String(identifier).trim().split(/\s+/).filter(Boolean);
      return parts.length >= 2 ? parts[1].toUpperCase() : "";
    }

    function extractStates(areaDesc) {
      const matches = String(areaDesc).match(/\b[A-Za-z]{2}\b/g);
      return matches ? matches.map(state => state.toUpperCase()) : [];
    }

    function passesStateFilter(areaDesc) {
      const states = extractStates(areaDesc);
      if (!states.length) return true;
      return states.some(state => stateToggles[state]);
    }

    function alertCategoryEnabled(categoryName) {
      return alertCategoryToggles[categoryName.toLowerCase()] !== false;
    }

    function populateSettingsMenu() {
      const stateContainer = document.getElementById("state-group");
      Object.keys(stateToggles).forEach(state => {
        const div = document.createElement("div");
        div.className = "alert-toggle";
        div.setAttribute("data-type", state);

    function getText(node, tag) {

    const ALERT_FIELD_NAMES = {

      TORNADO: "Tornado",
      FLASH_FLOOD: "FlashFlood",

    function extractAlertFieldsFromWarnverlay(alertInfo) {
      const info = alertInfo || {};
      const fields = {};
      Object.entries(ALERT_FIELD_NAMES).forEach(([apiName, token]) => {
        const camelName = token[0].toLowerCase() + token.slice(1);
        const value = info[apiName] ?? info[token] ?? info[camelName];
        if (value != null && String(value).trim()) fields[token] = String(value).trim();
      });
      return fields;
    }

    function extractAlertFieldsFromAtom(entry) {
      const atomNames = Object.fromEntries(
        Object.values(ALERT_FIELD_NAMES).map(token => [(token[0].toLowerCase() + token.slice(1)).toLowerCase(), token])
      );
      const fields = {};
      Array.from(entry.getElementsByTagName("cap:parameter")).forEach(parameter => {
        const name = getText(parameter, "valueName").trim().toLowerCase();
        const token = atomNames[name];
        const value = getText(parameter, "value").trim();
        if (token && value) fields[token] = value;
      });
      return fields;
    }

    // replace previous generateAlertKey with id-aware version
    const normalizeArea = area => area.toLowerCase().trim();

    function generateAlertKey(eventText, areaDesc, id) {
      // prefer using a stable id when available so two different alerts
      // with identical text/areas are not treated as the same record
      if (id) return `${eventText.toLowerCase().trim()}|${normalizeArea(areaDesc)}|id:${id}`;
      return `${eventText.toLowerCase().trim()}|${normalizeArea(areaDesc)}`;
    }

    function formatAreaDesc(areaDesc) {
      const areas = areaDesc.split(";")
        .map(a => a.trim())

    function enqueueAlertRaw(options) {
      const { type, alertKey, force } = options;
      const issuedMap = {
        severe: issuedSevereAlerts,
        tornado: issuedTornadoAlerts,
        flashFlood: issuedFlashFloodAlerts,
        specialStatement: issuedSpecialStatementAlerts,
        severeWatch: issuedSevereWatchAlerts,
        tornadoWatch: issuedTornadoWatchAlerts,
        winterStorm: issuedWinterStormAlerts,
        blizzard: issuedBlizzardAlerts,
        tropicalStorm: issuedTropicalStormAlerts,
        hurricane: issuedHurricaneAlerts,
        snowSquall: issuedSnowSquallAlerts,
        winterWatch: issuedWinterWatchAlerts, // NEW mapping for WSA
        mesoscaleDiscussion: issuedMesoscaleDiscussionAlerts,
        mesoscalePrecipitationDiscussion: issuedMesoscalePrecipitationDiscussionAlerts,
        dustStorm: issuedDustStormAlerts,
        custom: issuedCustomAlerts
      }[type];

      if (issuedMap[alertKey]?.queued && !force) return;

      const now = Date.now();
      if (now - lastQueuedTime[type] < throttleDelay) return;
      lastQueuedTime[type] = now;

      alertQueue.push(options);
      if (!issuedMap[alertKey]) {
        issuedMap[alertKey] = {
          state: options.state,
          queued: true,
          lastDisplayed: options.state
        };
      } else {
        issuedMap[alertKey].queued = true;
      }

      // if nothing is currently showing, start processing immediately
      // (prevents waiting for the next poll cycle)
      if (!isOverlayActive) {
        processNextAlert();
      }
    }

    function processNextAlert() {

      if (opts.type === "flashFlood") {

    function popupPixelsToRem(value) {
      return `${Number(value) / 16}rem`;

    function getPopupTextShadow(box, includeOutline = true, includeShadows = true) {
      const shadows = [];
      const outline = Number(box.textOutlineWidth);
      if (includeOutline && box.textOutlinePosition === "outside" && Number.isFinite(outline) && outline > 0) {
        const color = box.textOutlineColor || "#000000";
        const width = Math.max(0, outline);
        if (box.textOutlineStyle === "rounded") {
          const ringCount = Math.max(12, Math.min(48, Math.ceil(width * 10)));
          for (let i = 0; i < ringCount; i += 1) {
            const angle = (Math.PI * 2 * i) / ringCount;
            const dx = (Math.cos(angle) * width).toFixed(2);
            const dy = (Math.sin(angle) * width).toFixed(2);
            shadows.push(`${popupPixelsToRem(dx)} ${popupPixelsToRem(dy)} 0 ${color}`);
          }
        } else {
          const radius = Math.ceil(width);
          for (let x = -radius; x <= radius; x += 1) {
            const scaledX = (x / radius) * width;
            shadows.push(`${popupPixelsToRem(scaledX)} ${popupPixelsToRem(-width)} 0 ${color}`,
              `${popupPixelsToRem(scaledX)} ${popupPixelsToRem(width)} 0 ${color}`);
          }
          for (let y = -radius + 1; y <= radius - 1; y += 1) {
            const scaledY = (y / radius) * width;
            shadows.push(`${popupPixelsToRem(-width)} ${popupPixelsToRem(scaledY)} 0 ${color}`,
              `${popupPixelsToRem(width)} ${popupPixelsToRem(scaledY)} 0 ${color}`);
          }
        }
      }
      const size = Number(box.textDropShadowSize);
      if (includeShadows && box.textDropShadowEnabled && Number.isFinite(size) && size > 0) {
        const angle = (Number(box.textDropShadowAngle) || 45) * Math.PI / 180;
        const distance = Number(box.textDropShadowDistance) || 5;
        const offsetX = Math.round(Math.cos(angle) * distance);
        const offsetY = Math.round(Math.sin(angle) * distance);
        const opacityValue = box.textDropShadowOpacity == null ? 100 : Number(box.textDropShadowOpacity);
        const opacity = Math.max(0, Math.min(100, Number.isFinite(opacityValue) ? opacityValue : 100)) / 100;
        const color = box.textDropShadowColor || "#000000";
        const rgb = /^#([0-9a-f]{6})$/i.exec(color);
        const shadowColor = rgb ?
          `rgba(${parseInt(rgb[1].slice(0, 2), 16)}, ${parseInt(rgb[1].slice(2, 4), 16)}, ${parseInt(rgb[1].slice(4, 6), 16)}, ${opacity})` :
          color;
        const blur = Math.max(0, size);
        shadows.push(`${popupPixelsToRem(offsetX)} ${popupPixelsToRem(offsetY)} ${popupPixelsToRem(blur)} ${shadowColor}`);
        const spread = Math.max(0, Number(box.textDropShadowSpread) || 0);
        if (spread > 0) {
          const stepCount = Math.max(1, Math.min(4, Math.floor(spread / 8) + 1));
          for (let i = 1; i <= stepCount; i += 1) {
            shadows.push(
              `${popupPixelsToRem(offsetX + i)} ${popupPixelsToRem(offsetY)} ${popupPixelsToRem(blur)} ${shadowColor}`,
              `${popupPixelsToRem(offsetX - i)} ${popupPixelsToRem(offsetY)} ${popupPixelsToRem(blur)} ${shadowColor}`,
              `${popupPixelsToRem(offsetX)} ${popupPixelsToRem(offsetY + i)} ${popupPixelsToRem(blur)} ${shadowColor}`,
              `${popupPixelsToRem(offsetX)} ${popupPixelsToRem(offsetY - i)} ${popupPixelsToRem(blur)} ${shadowColor}`
            );
          }
        }
      }
      if (includeShadows && Number(box.textShadowSize) > 0) {
        shadows.push(`${popupPixelsToRem(2)} ${popupPixelsToRem(2)} ${popupPixelsToRem(Number(box.textShadowSize))} ${box.textShadowColor || "#000000"}`);
      }
      return shadows.length ? shadows.join(", ") : "none";
    }

    function appendPopupTextEffectLayer(motionLayer, text, shadow, zIndex) {
      if (!shadow || shadow === "none") return;

      effect.style.inset = "0";

      effect.style.backgroundClip = "initial";
      effect.style.webkitBackgroundClip = "initial";
      effect.style.webkitTextFillColor = "transparent";
      effect.style.webkitTextStroke = "0px transparent";
      effect.style.textShadow = shadow;

    function renderPopupCustomization(alertType, eventText, areaDesc, concerning = "", discussionFields = {}) {
      const layer = document.getElementById("popupCustomLayer");

      (Array.isArray(config.boxes) ? config.boxes : []).forEach((box, index) => {

        if (typeof box.text === "string" && box.text.trim()) {
          hasCustomText = true;
          const text = document.createElement("span");
          const alertFields = discussionFields.alertFields || {};
          const tokens = {
            AlertName: eventText,
            Areas: areaDesc,
            Conserning: concerning,
            Concerning: concerning,
            WatchProbability: discussionFields.watchProbability == null ? "" : String(discussionFields.watchProbability),
            MostProbablePeakTornadoIntensity: discussionFields.mostProbablePeakTornadoIntensity == null ? "" : String(discussionFields.mostProbablePeakTornadoIntensity),
            MostProbablePeakWindGust: discussionFields.mostProbablePeakWindGust == null ? "" : String(discussionFields.mostProbablePeakWindGust),
            MaxHailSize: alertFields.MaxHailSize == null ? "" : String(alertFields.MaxHailSize),
            TornadoDamageThreat: alertFields.TornadoDamageThreat == null ? "" : String(alertFields.TornadoDamageThreat),
            Tornado: alertFields.Tornado == null ? "" : String(alertFields.Tornado),
            FlashFlood: alertFields.FlashFlood == null ? "" : String(alertFields.FlashFlood),
            FlashFloodDamageThreat: alertFields.FlashFloodDamageThreat == null ? "" : String(alertFields.FlashFloodDamageThreat),
            ThunderstormDamageThreat: alertFields.ThunderstormDamageThreat == null ? "" : String(alertFields.ThunderstormDamageThreat),
            MaxWindGust: alertFields.MaxWindGust == null ? "" : String(alertFields.MaxWindGust),
            WindThreat: alertFields.WindThreat == null ? "" : String(alertFields.WindThreat),
            HailThreat: alertFields.HailThreat == null ? "" : String(alertFields.HailThreat),
            Hazard: alertFields.Hazard == null ? "" : String(alertFields.Hazard),
            Source: alertFields.Source == null ? "" : String(alertFields.Source),
            Impact: alertFields.Impact == null ? "" : String(alertFields.Impact),
            AlertInstructions: "",

            TornadoWarnings: eventText,
            SevereThunderstormWarnings: eventText,
            FloodAlerts: eventText,
            WinterWeatherAlerts: eventText
          };

          let rawText = box.text.trim();
          const alertFieldTokens = [
            "MaxHailSize", "TornadoDamageThreat", "Tornado", "FlashFlood",
            "FlashFloodDamageThreat", "ThunderstormDamageThreat", "MaxWindGust",
            "WindThreat", "HailThreat", "Hazard", "Source", "Impact"
          ];
          alertFieldTokens.forEach(token => {
            if (tokens[token].trim()) return;
            const segmentPattern = new RegExp(`(^|[|\\n])\\s*[^|\\n]*\\(${token}\\)[^|\\n]*(?=$|[|\\n])`, "g");
            rawText = rawText.replace(segmentPattern, "$1");
          });
          rawText = rawText
            .replace(/^\s*\|\s*/, "")
            .replace(/\s*\|\s*$/, "")
            .replace(/\s*\|\s*\|\s*/g, " | ")
            .replace(/\n{2,}/g, "\n");
          const alertOverride = (window.POPUP_ALERT_CUSTOMIZATIONS && window.POPUP_ALERT_CUSTOMIZATIONS[alertType] && window.POPUP_ALERT_CUSTOMIZATIONS[alertType].textOverrides && window.POPUP_ALERT_CUSTOMIZATIONS[alertType].textOverrides.normal) || "";
          const upgradedOverride = (window.POPUP_ALERT_CUSTOMIZATIONS && window.POPUP_ALERT_CUSTOMIZATIONS[alertType] && window.POPUP_ALERT_CUSTOMIZATIONS[alertType].textOverrides && window.POPUP_ALERT_CUSTOMIZATIONS[alertType].textOverrides.upgraded) || "";
          const fallbackAlertName = (/(upgraded|upgraded alert)/i.test(eventText) ? upgradedOverride : alertOverride) || eventText;
          const literalMatch = rawText.toLowerCase() === eventText.toLowerCase() || rawText.toLowerCase() === "alertname" || rawText.toLowerCase() === "[alertname]" || rawText.toLowerCase() === "(alertname)";

          let renderedText = rawText.replace(/\((AlertName|Areas|Conserning|Concerning|WatchProbability|MostProbablePeakTornadoIntensity|MostProbablePeakWindGust|MaxHailSize|TornadoDamageThreat|Tornado|FlashFlood|FlashFloodDamageThreat|ThunderstormDamageThreat|MaxWindGust|WindThreat|HailThreat|Hazard|Source|Impact|AlertInstructions|ExpireTime|TornadoWarnings|SevereThunderstormWarnings|FloodAlerts|WinterWeatherAlerts)\)/g, (match, token) => {
            if (token === "AlertName" || token.endsWith("Warnings") || token === "FloodAlerts") hasEventText = true;
            if (token === "Areas") hasAreaText = true;

          });

          if (literalMatch && fallbackAlertName) {

          }
          const hasDiscussionTokens = /\((Conserning|Concerning|WatchProbability|MostProbablePeakTornadoIntensity|MostProbablePeakWindGust)\)/.test(rawText);
          const hasRecognizedTokens = /\((AlertName|Areas|Conserning|Concerning|WatchProbability|MostProbablePeakTornadoIntensity|MostProbablePeakWindGust|MaxHailSize|TornadoDamageThreat|Tornado|FlashFlood|FlashFloodDamageThreat|ThunderstormDamageThreat|MaxWindGust|WindThreat|HailThreat|Hazard|Source|Impact|AlertInstructions|ExpireTime|TornadoWarnings|SevereThunderstormWarnings|FloodAlerts|WinterWeatherAlerts)\)/.test(rawText);

    function startPopupAreaMarquees(layer) {
