<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pop Up Alerts Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    html { font-size: min(0.833333vw, 1.481481vh); }
    body { font-family: Arial, sans-serif; }

    #overlay {
      display: none;
      position: fixed;
      left: 50%;
      top: 50%;
      width: min(100vw, calc(100vh * (16 / 9)));
      height: min(100vh, calc(100vw * (9 / 16)));
      aspect-ratio: 16 / 9;
      transform: translate(-50%, -50%);
      overflow: hidden;
      background-color: rgba(0,0,0,0);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
    }

    #overlay img {
      max-width: 90%; max-height: 90%;
      opacity: 1;
      transition: opacity 1.5s ease-in-out;
    }

    #popupCustomLayer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      aspect-ratio: 16 / 9;
      z-index: 1;
      pointer-events: none;
      overflow: visible;
    }

    #popupCustomLayer .popup-custom-box,
    #popupCustomLayer .popup-custom-media {
      position: absolute;
      box-sizing: border-box;
      pointer-events: none;
    }

    #popupCustomLayer .popup-custom-box { overflow: visible; }
    #popupCustomLayer .popup-custom-surface {
      position: absolute;
      inset: 0;
      box-sizing: border-box;
      transform-origin: 0 0;
      pointer-events: none;
    }
    #popupCustomLayer .popup-custom-motion {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    #popupCustomLayer .popup-custom-motion > span {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 0.25rem;
      white-space: pre-wrap;
    }
    .popup-custom-text-content {
      display: block;
      width: 100%;
      text-align: inherit;
      white-space: pre-wrap;
    }
    .popup-discussion-text-content {
      min-width: 0;
      overflow: hidden;
      white-space: pre;
    }
    .popup-area-viewport {
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      white-space: nowrap;
      text-align: left;
      vertical-align: bottom;
    }
    .popup-area-text { display: inline-block; white-space: nowrap; }
    .popup-area-marquee {
      display: inline-flex;
      width: max-content;
    }
    .popup-area-marquee > span {
      flex: none;
      padding-right: 2em;
    }
    #popupCustomLayer .popup-custom-media img,
    #popupCustomLayer .popup-custom-media video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    @keyframes popup-box-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes popup-box-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-0.375rem); } }
    @keyframes popup-box-zoom { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @keyframes popup-light-sweep { 0% { background-position: -40% 50%; } 100% { background-position: 140% 50%; } }

    .text-container {
      position: absolute;
      font-size: 2.3rem;
      font-weight: bold;
      font-family: 'Bebas Neue', sans-serif;
      text-align: center;
      opacity: 0;
      transition: opacity 2s ease-in-out;
      color: rgb(255,255,255);
    }

    #testCountyContainer {
      width: 80%;
      max-width: 90%;
      overflow: hidden;
      white-space: nowrap;
      box-sizing: border-box;
    }
    #testCountyContainer.marquee-active { text-align: left; }

    .alert-area-marquee {
      display: inline-flex;
      width: max-content;
    }
    .alert-area-marquee > span {
      flex: none;
      padding-right: 2em;
    }

    /* Severe Thunderstorm Warning */
    .severe#testWarningContainer {
      top: 78.1%; left: 59.2%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
    }
    .severe#testCountyContainer {
      top: 81.6%; left: 58.9%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
      font-size: 1.3rem;
    }
    .considerableSevere#testWarningContainer { color: rgb(255, 255, 255) !important; }
    .considerableSevere#testCountyContainer { color: rgb(255, 255, 255) !important; }
    .destructiveSevere#testWarningContainer { color: rgb(255, 255, 255) !important; }
    .destructiveSevere#testCountyContainer { color: rgb(255, 255, 255) !important; }

    /* Flash Flood Warning */
    .flashFlood#testWarningContainer {
      top: 78.1%; left: 59.2%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
    }
    .flashFlood#testCountyContainer {
      top: 81.6%; left: 58.9%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
      font-size: 1.3rem;
    }
    .considerableFlashFlood#testWarningContainer { color: rgb(255, 255, 255) !important; }
    .considerableFlashFlood#testCountyContainer { color: rgb(255, 255, 255) !important; }
    .catastrophicFlashFlood#testWarningContainer { color: rgb(255, 255, 255) !important; }
    .catastrophicFlashFlood#testCountyContainer { color: rgb(255, 255, 255) !important; }

    /* Tornado Warning */
    .tornado#testWarningContainer {
      top: 78.1%; left: 59.2%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
    }
    .tornado#testCountyContainer {
      top: 81.6%; left: 58.9%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
      font-size: 1.3rem;
    }
    .pdsTornado#testWarningContainer { color: rgb(255, 255, 255) !important; }
    .pdsTornado#testCountyContainer { color: rgb(255, 255, 255) !important; }
    .tornadoEmergency#testWarningContainer { color: rgb(255, 255, 255) !important; }
    .tornadoEmergency#testCountyContainer { color: rgb(255, 255, 255) !important; }

    /* Special Weather Statement */
    .specialStatement#testWarningContainer {
      top: 78.1%; left: 59.2%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
    }
    .specialStatement#testCountyContainer {
      top: 81.6%; left: 58.9%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
      font-size: 1.3rem;
    }

    /* Severe Thunderstorm Watch */
    .severeWatch#testWarningContainer {
      top: 78.1%; left: 59.2%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
    }
    .severeWatch#testCountyContainer {
      top: 81.6%; left: 58.9%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
      font-size: 1.3rem;
    }

    /* Tornado Watch */
    .tornadoWatch#testWarningContainer {
      top: 78.1%; left: 59.2%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
    }
    .tornadoWatch#testCountyContainer {
      top: 81.6%; left: 58.9%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
      font-size: 1.3rem;
    }

    /* Winter Storm Warning */
    .winterStorm#testWarningContainer {
      top: 78.1%; left: 59.2%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
    }
    .winterStorm#testCountyContainer {
      top: 81.6%; left: 58.9%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
      font-size: 1.3rem;
    }

    /* Blizzard Warning */
    .blizzard#testWarningContainer {
      top: 78.1%; left: 59.2%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
    }
    .blizzard#testCountyContainer {
      top: 81.6%; left: 58.9%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255);
      font-size: 1.3rem;
    }

    /* Tropical Storm Warning */
    .tropicalStorm#testWarningContainer {
      top: 78.1%; left: 59.2%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255); /* event text color as requested */
    }
    .tropicalStorm#testCountyContainer {
      top: 81.6%; left: 58.9%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255); /* areadesc color as requested */
      font-size: 1.3rem;
    }

    /* Hurricane Warning */
    .hurricane#testWarningContainer {
      top: 78.1%; left: 59.2%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255); /* event text color as requested */
    }
    .hurricane#testCountyContainer {
      top: 81.6%; left: 58.9%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255); /* areadesc color as requested */
      font-size: 1.3rem;
    }

    /* Snow Squall Warning */
    .snowSquall#testWarningContainer {
      top: 78.1%; left: 59.2%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255); /* event text color requested */
    }
    .snowSquall#testCountyContainer {
      top: 81.6%; left: 58.9%;
      transform: translate(-50%, -50%);
      color: rgb(255, 255, 255); /* areadesc color requested */
      font-size: 1.3rem;
    }

    /* Winter Storm Watch */
    .winterWatch#testWarningContainer {

    }
    .winterWatch#testCountyContainer {

    .button-group {
      position: absolute;
      top: 10px; left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .button-group button {
      font-size: 1.1rem;
      padding: 8px 18px;
      font-family: 'Bebas Neue', Arial, sans-serif;
      cursor: pointer;
    }
    .test-buttons {
      position: absolute;
      top: 10px; left: 10px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .test-buttons button {

</head>
<body>
  <script src="./popup-alert-customizations.js"></script>
  <div class="test-buttons">
    <button onclick="setTestMode('new', this)">Test as New Alert</button>
    <button onclick="setTestMode('upgraded', this)">Test as Upgraded Alert</button>
  </div>
  <div class="button-group">
    <button onclick="showAlert('severe')">Severe Thunderstorm Warning</button>
    <button onclick="showAlert('severe_considerable')">Severe Thunderstorm Warning – Considerable</button>
    <button onclick="showAlert('severe_destructive')">PDS Severe Thunderstorm Warning - Destructive</button>
    <button onclick="showAlert('tornado')">Tornado Warning</button>
    <button onclick="showAlert('tornado_observed')">Observed Tornado Warning</button>
    <button onclick="showAlert('tornado_pds')">PDS Tornado Warning</button>
    <button onclick="showAlert('tornado_emergency')">Tornado Emergency</button>
    <button onclick="showAlert('flashflood')">Flash Flood Warning</button>
    <button onclick="showAlert('flashflood_considerable')">Flash Flood Warning - Considerable</button>
    <button onclick="showAlert('flashflood_catastrophic')">Flash Flood Emergency</button>
    <button onclick="showAlert('special_statement')">Special Weather Statement</button>
    <button onclick="showAlert('special_marine_warning')">Special Marine Warning</button>
    <button onclick="showAlert('severe_watch')">Severe Thunderstorm Watch</button>
    <button onclick="showAlert('tornado_watch')">Tornado Watch</button>
    <button onclick="showAlert('winter_storm')">Winter Storm Warning</button>
    <button onclick="showAlert('blizzard')">Blizzard Warning</button>
    <button onclick="showAlert('tropical_storm')">Tropical Storm Warning</button>
    <button onclick="showAlert('hurricane')">Hurricane Warning</button>
    <button onclick="showAlert('snow_squall')">Snow Squall Warning</button>
    <button onclick="showAlert('winter_watch')">Winter Storm Watch</button>
    <button onclick="showAlert('dust_advisory')">Dust Advisory</button>
    <button onclick="showAlert('dust_storm')">Dust Storm Warning</button>
    <button onclick="showAlert('dust_storm_pds')">PDS Dust Storm Warning</button>
    <button onclick="showAlert('mesoscale_discussion')">Mesoscale Discussion</button>
    <button onclick="showAlert('mesoscale_precipitation_discussion')">Mesoscale Percipitation Discussion</button>
  </div>
  <div id="overlay">
    <img id="overlayImage" src="" alt="Warning Image" />
    <div id="popupCustomLayer" aria-hidden="true"></div>
    <audio id="overlayAudio"></audio>
    <div id="testWarningContainer" class="text-container severe"></div>
    <div id="testCountyContainer"  class="text-container severe"></div>
  </div>

  <script>
    let alertQueue = [], isOverlayActive = false, initialLoad = true;
    let testAsUpgraded = false;

    const issuedSevereAlerts       = {};
    const issuedTornadoAlerts      = {};
    const issuedFlashFloodAlerts   = {};

    const lastQueuedTime = {
      tornado: 0,
      severe: 0,
      flashFlood: 0
    };
    const throttleDelay = 0;

    function getText(node, tag) {
      return node.querySelector(tag)?.textContent || "";
    }

    // replace previous generateAlertKey with id-aware version
    const normalizeArea = area => area.toLowerCase().trim();

    function generateAlertKey(eventText, areaDesc, id) {
      // prefer using a stable id when available so two different alerts
      // with identical text/areas are not treated as the same record
      if (id) return `${eventText.toLowerCase().trim()}|${normalizeArea(areaDesc)}|id:${id}`;
      return `${eventText.toLowerCase().trim()}|${normalizeArea(areaDesc)}`;
    }

    function formatAreaDesc(areaDesc) {
      const areas = areaDesc.split(";")
        .map(a => a.trim())
        .filter(a => a);
      return areas.join("; ");
    }

    function enqueueAlert(options) {
      const { type, alertKey, force } = options;
      const issuedMap = {
        severe: issuedSevereAlerts,
        tornado: issuedTornadoAlerts,
        flashFlood: issuedFlashFloodAlerts
      }[type];

      if (issuedMap[alertKey]?.queued && !force) return;

      const now = Date.now();
      if (now - lastQueuedTime[type] < throttleDelay) return;
      lastQueuedTime[type] = now;

      alertQueue.push(options);
      if (!issuedMap[alertKey]) {
        issuedMap[alertKey] = {
          state: options.state,
          queued: true,
          lastDisplayed: options.state
        };
      } else {
        issuedMap[alertKey].queued = true;
      }
    }

    function processNextAlert() {
      if (!alertQueue.length) return;
      isOverlayActive = true;
      triggerWarning(alertQueue.shift());
    }

    function getPopupCustomizationType(opts) {
      if (opts.customizationType) return opts.customizationType;
      if (opts.type === "severe") {
        return opts.destructive ? "Destructive Severe Thunderstorm Warning" :
          opts.considerable ? "Considerable Severe Thunderstorm Warning" : "Severe Thunderstorm Warning";
      }
      if (opts.type === "tornado") {
        return opts.emergency ? "Tornado Emergency" : opts.pds ? "PDS Tornado Warning" :
          opts.state === "OBSERVED" ? "Observed Tornado Warning" : "Tornado Warning";
      }
      if (opts.type === "flashFlood") {
        return opts.flashFloodCatastrophic ? "Flash Flood Emergency" :
          opts.flashFloodConsiderable ? "Considerable Flash Flood Warning" : "Flash Flood Warning";
      }
      return ({
        specialStatement: "Special Weather Statement",
        severeWatch: "Severe Thunderstorm Watch",
        tornadoWatch: "Tornado Watch",
        winterStorm: "Winter Storm Warning",
        blizzard: "Blizzard Warning",
        tropicalStorm: "Tropical Storm Warning",
        hurricane: "Hurricane Warning",
        snowSquall: "Snow Squall Warning",
        winterWatch: "Winter Storm Watch",
        dustStorm: opts.pds ? "PDS Dust Storm Warning" : "Dust Storm Warning",
        mesoscaleDiscussion: "Mesoscale Discussion",
        mesoscalePrecipitationDiscussion: "Mesoscale Percipitation Discussion"
      })[opts.type] || "";
    }

    function popupPixelsToRem(value) {
      return `${Number(value) / 16}rem`;
    }

    function getPopupTextShadow(box, includeOutline = true, includeShadows = true) {
      const shadows = [];
      const outline = Number(box.textOutlineWidth);
      if (includeOutline && box.textOutlinePosition === "outside" && Number.isFinite(outline) && outline > 0) {
        const color = box.textOutlineColor || "#000000";
        const width = Math.max(0, outline);
        if (box.textOutlineStyle === "rounded") {
          const ringCount = Math.max(12, Math.min(48, Math.ceil(width * 10)));
          for (let i = 0; i < ringCount; i += 1) {
            const angle = (Math.PI * 2 * i) / ringCount;
            const dx = (Math.cos(angle) * width).toFixed(2);
            const dy = (Math.sin(angle) * width).toFixed(2);
            shadows.push(`${popupPixelsToRem(dx)} ${popupPixelsToRem(dy)} 0 ${color}`);
          }
        } else {
          const radius = Math.ceil(width);
          for (let x = -radius; x <= radius; x += 1) {
            const scaledX = (x / radius) * width;
            shadows.push(`${popupPixelsToRem(scaledX)} ${popupPixelsToRem(-width)} 0 ${color}`,
              `${popupPixelsToRem(scaledX)} ${popupPixelsToRem(width)} 0 ${color}`);
          }
          for (let y = -radius + 1; y <= radius - 1; y += 1) {
            const scaledY = (y / radius) * width;
            shadows.push(`${popupPixelsToRem(-width)} ${popupPixelsToRem(scaledY)} 0 ${color}`,
              `${popupPixelsToRem(width)} ${popupPixelsToRem(scaledY)} 0 ${color}`);
          }
        }
      }
      const size = Number(box.textDropShadowSize);
      if (includeShadows && box.textDropShadowEnabled && Number.isFinite(size) && size > 0) {
        const angle = (Number(box.textDropShadowAngle) || 45) * Math.PI / 180;
        const distance = Number(box.textDropShadowDistance) || 5;
        const offsetX = Math.round(Math.cos(angle) * distance);
        const offsetY = Math.round(Math.sin(angle) * distance);
        const opacityValue = box.textDropShadowOpacity == null ? 100 : Number(box.textDropShadowOpacity);
        const opacity = Math.max(0, Math.min(100, Number.isFinite(opacityValue) ? opacityValue : 100)) / 100;
        const color = box.textDropShadowColor || "#000000";
        const rgb = /^#([0-9a-f]{6})$/i.exec(color);
        const shadowColor = rgb ?
          `rgba(${parseInt(rgb[1].slice(0, 2), 16)}, ${parseInt(rgb[1].slice(2, 4), 16)}, ${parseInt(rgb[1].slice(4, 6), 16)}, ${opacity})` :
          color;
        const blur = Math.max(0, size);
        shadows.push(`${popupPixelsToRem(offsetX)} ${popupPixelsToRem(offsetY)} ${popupPixelsToRem(blur)} ${shadowColor}`);
        const spread = Math.max(0, Number(box.textDropShadowSpread) || 0);
        if (spread > 0) {
          const stepCount = Math.max(1, Math.min(4, Math.floor(spread / 8) + 1));
          for (let i = 1; i <= stepCount; i += 1) {
            shadows.push(
              `${popupPixelsToRem(offsetX + i)} ${popupPixelsToRem(offsetY)} ${popupPixelsToRem(blur)} ${shadowColor}`,
              `${popupPixelsToRem(offsetX - i)} ${popupPixelsToRem(offsetY)} ${popupPixelsToRem(blur)} ${shadowColor}`,
              `${popupPixelsToRem(offsetX)} ${popupPixelsToRem(offsetY + i)} ${popupPixelsToRem(blur)} ${shadowColor}`,
              `${popupPixelsToRem(offsetX)} ${popupPixelsToRem(offsetY - i)} ${popupPixelsToRem(blur)} ${shadowColor}`
            );
          }
        }
      }
      if (includeShadows && Number(box.textShadowSize) > 0) {
        shadows.push(`${popupPixelsToRem(2)} ${popupPixelsToRem(2)} ${popupPixelsToRem(Number(box.textShadowSize))} ${box.textShadowColor || "#000000"}`);
      }
      return shadows.length ? shadows.join(", ") : "none";
    }

    function appendPopupTextEffectLayer(motionLayer, text, shadow, zIndex) {
      if (!shadow || shadow === "none") return;
      const effect = text.cloneNode(true);
      effect.setAttribute("aria-hidden", "true");
      effect.style.position = "absolute";
      effect.style.inset = "0";
      effect.style.zIndex = String(zIndex);
      effect.style.color = "transparent";
      effect.style.backgroundImage = "none";
      effect.style.backgroundClip = "initial";
      effect.style.webkitBackgroundClip = "initial";
      effect.style.webkitTextFillColor = "transparent";
      effect.style.webkitTextStroke = "0px transparent";
      effect.style.textShadow = shadow;
      motionLayer.appendChild(effect);
    }

    function renderPopupCustomization(alertType, eventText, areaDesc, concerning = "", discussionFields = {}) {
      const layer = document.getElementById("popupCustomLayer");
      if (!layer) return;
      layer.replaceChildren();
      layer.dataset.alertType = "";
      const customizations = window.POPUP_ALERT_CUSTOMIZATIONS;
      if (!customizations || !Object.prototype.hasOwnProperty.call(customizations, alertType)) return;
      const config = customizations[alertType];
      if (!config || typeof config !== "object") return;
      layer.dataset.alertType = alertType;

      let hasEventText = false;
      let hasAreaText = false;
      let hasCustomText = false;
      const media = config.media;
      if (media && typeof media.src === "string" && media.src) {
        const wrapper = document.createElement("div");
        wrapper.className = "popup-custom-media";
        const mediaElement = document.createElement(media.mediaType === "video" ? "video" : "img");
        mediaElement.src = media.src;
        if (mediaElement instanceof HTMLVideoElement) {
          mediaElement.muted = true;
          mediaElement.loop = true;
          mediaElement.autoplay = true;
          mediaElement.playsInline = true;
        }
        mediaElement.draggable = false;
        wrapper.appendChild(mediaElement);
        layer.appendChild(wrapper);
      }

      (Array.isArray(config.boxes) ? config.boxes : []).forEach((box, index) => {
        if (!box || ![box.x, box.y, box.width, box.height].every(value => Number.isFinite(Number(value)))) return;
        const element = document.createElement("div");
        element.className = "popup-custom-box";
        element.dataset.boxIndex = String(index);
        const surface = document.createElement("div");
        surface.className = "popup-custom-surface";
        const motionLayer = document.createElement("div");
        motionLayer.className = "popup-custom-motion";

        if (typeof box.text === "string" && box.text.trim()) {
          hasCustomText = true;
          const text = document.createElement("span");
          const alertFields = discussionFields.alertFields || {};
          const formatDamageThreat = (hazard, value) => {
            const level = value == null ? "" : String(value).trim();
            if (!level) return "";
            return `${hazard} Damage Threat ${level.toLowerCase().replace(/\b[a-z]/g, character => character.toUpperCase())}`;
          };
          const tokens = {
            AlertName: eventText,
            Areas: areaDesc,
            Conserning: concerning,
            Concerning: concerning,
            WatchProbability: discussionFields.watchProbability == null ? "" : String(discussionFields.watchProbability),
            MostProbablePeakTornadoIntensity: discussionFields.mostProbablePeakTornadoIntensity == null ? "" : String(discussionFields.mostProbablePeakTornadoIntensity),
            MostProbablePeakWindGust: discussionFields.mostProbablePeakWindGust == null ? "" : String(discussionFields.mostProbablePeakWindGust),
            MaxHailSize: alertFields.MaxHailSize == null ? "" : String(alertFields.MaxHailSize),
            TornadoDamageThreat: formatDamageThreat("Tornado", alertFields.TornadoDamageThreat),
            Tornado: alertFields.Tornado == null ? "" : String(alertFields.Tornado),

      if (!box.groupId) return boxCenter;

      const members = boxes.filter(member => member && member.groupId === box.groupId);
      if (members.length < 2) return boxCenter;

      let left = Infinity;
      let top = Infinity;
      let right = -Infinity;
      let bottom = -Infinity;
      for (const member of members) {
        left = Math.min(left, Number(member.x));
        top = Math.min(top, Number(member.y));
        right = Math.max(right, Number(member.x) + Number(member.width));
        bottom = Math.max(bottom, Number(member.y) + Number(member.height));
      }
      if (!(right > left) || !(bottom > top)) return boxCenter;
      return { x: left + (right - left) / 2, y: top + (bottom - top) / 2 };
    }

    async function playPopupCustomizationAnimations(config, areaMarqueePromise, sequenceStartTime) {
      const layer = document.getElementById("popupCustomLayer");
      if (!layer || !config) return;
      const rect = layer.getBoundingClientRect();
      const boxes = Array.isArray(config.boxes) ? config.boxes : [];
      const elements = Array.from(layer.querySelectorAll(".popup-custom-box"));
      const cssDuration = getPopupCssAnimationDuration(layer);
      const cssAnimation = cssDuration > 0 ? new Promise(resolve => setTimeout(resolve, cssDuration)) : Promise.resolve();
      const playPhase = (phase, delayCompensationMs = 0) => Promise.all(elements.map(element => {
        const box = boxes[Number(element.dataset.boxIndex)];
        let transition = box ? (phase === "in" ? box.transitionIn : box.transitionOut) : null;
        if (transition && (transition.type === "MotionPath" || transition.secondAnimation && transition.secondAnimation.type === "MotionPath")) {
          const origin = getPopupMotionPathOrigin(box, boxes);
          transition = {
            ...transition,
            _originX: origin.x,
            _originY: origin.y
          };
        }
        return playPopupBoxTransition(element, transition, phase, rect, boxes, delayCompensationMs);
      }));
      await Promise.all([playPhase("in"), cssAnimation, areaMarqueePromise || Promise.resolve()]);
      const elapsedMs = Number.isFinite(sequenceStartTime) ? Math.max(0, performance.now() - sequenceStartTime) : 0;
      const outDelays = boxes.flatMap(box => getPopupTransitionDelays(box && box.transitionOut));
      const earliestOutDelayMs = outDelays.length ? Math.min(...outDelays) : 0;
      // Shift the exit timeline uniformly so earlier waits don't collapse its stagger.
      const delayCompensationMs = Math.min(elapsedMs, earliestOutDelayMs);
      await playPhase("out", delayCompensationMs);
    }

      const configuredAlertText = popupCustomization && popupCustomization.textOverrides &&

        .catch(error => console.warn("Popup transition animation failed.", error))
        .finally(() => finishPopupAlert(overlay, overlayImage));
    }

    // Helper: Extract damage threats and detection from TropiTracker description
    function extractThreatsFromDescription(desc) {
      desc = desc || "";
      return {
        tornadoDetection:
          /TORNADO\.\.\.(OBSERVED|RADAR INDICATED)/i.test(desc)
            ? desc.match(/TORNADO\.\.\.(OBSERVED|RADAR INDICATED)/i)[1]
            : null,
        tornadoDamageThreatCatastrophic:
          /TORNADO DAMAGE THREAT\.\.\.CATASTROPHIC/i.test(desc),
        tornadoDamageThreatConsiderable:
          /TORNADO DAMAGE THREAT\.\.\.CONSIDERABLE/i.test(desc),
        thunderstormDamageThreatConsiderable:
          /THUNDERSTORM DAMAGE THREAT\.\.\.CONSIDERABLE/i.test(desc),
        thunderstormDamageThreatDestructive:
          /THUNDERSTORM DAMAGE THREAT\.\.\.DESTRUCTIVE/i.test(desc),
        flashFloodDamageThreat:
          /FLASH FLOOD DAMAGE THREAT\.\.\.(CATASTROPHIC|CONSIDERABLE)/i.test(desc)
            ? desc.match(/FLASH FLOOD DAMAGE THREAT\.\.\.(CATASTROPHIC|CONSIDERABLE)/i)[1]
            : null
      };
    }

    // Helper: Extract damage threats and detection from Atom API parameters
    function extractThreatsFromAtom(entry) {
      const parameters = Array.from(entry.getElementsByTagName("cap:parameter"));
      let tornadoDetection = null,
          tornadoDamageThreatCatastrophic = false,
          tornadoDamageThreatConsiderable = false,
          thunderstormDamageThreatConsiderable = false,
          thunderstormDamageThreatDestructive = false,
          flashFloodDamageThreat = null;

      parameters.forEach(p => {
        const name = p.querySelector("valueName")?.textContent || "";
        const val  = p.querySelector("value")?.textContent || "";
        if (name === "tornadoDetection") {
          tornadoDetection = val;
        }
        if (name === "tornadoDamageThreat") {
          if (val === "CATASTROPHIC") tornadoDamageThreatCatastrophic = true;
          if (val === "CONSIDERABLE") tornadoDamageThreatConsiderable = true;
        }
        if (name === "thunderstormDamageThreat") {
          if (val === "CONSIDERABLE") thunderstormDamageThreatConsiderable = true;
          if (val === "DESTRUCTIVE") thunderstormDamageThreatDestructive = true;
        }
        if (name === "flashFloodDamageThreat") {
          if (val === "CATASTROPHIC" || val === "CONSIDERABLE") flashFloodDamageThreat = val;
        }
      });

      return {
        tornadoDetection,
        tornadoDamageThreatCatastrophic,
        tornadoDamageThreatConsiderable,
        thunderstormDamageThreatConsiderable,
        thunderstormDamageThreatDestructive,
        flashFloodDamageThreat
      };
    }

    // Fetch alerts from TropiTracker API (primary + all)
    async function fetchTropiTrackerAlerts() {
      try {
        const urls = [
          "",
          ""
        ];
        let allAlerts = [];
        for (const url of urls) {
          const resp = await fetch(url);
          const data = await resp.json();
          if (data.items && data.items.length) {
            allAlerts = allAlerts.concat(data.items);
          }
        }
        // Deduplicate by alert_id
        const seen = new Set();
        const deduped = [];
        for (const item of allAlerts) {
          const key = item.alert_id || `${item.event}|${item.areaDesc}|${item.expires}`;
          if (!seen.has(key)) {
            seen.add(key);
            deduped.push(item);
          }
        }
        // Map to unified alert objects with threat extraction
        return deduped.map(item => ({
          id: item.alert_id || undefined, // <--- ensure id present
          event: item.event || "",
          areaDesc: item.areaDesc || "",
          expires: item.expires || "",
          description: item.description || "",
          threats: extractThreatsFromDescription(item.description || "")
        }));
      } catch (e) {
        return [];
      }
    }

    // Fetch alerts from NWS API (old fallback)
    async function fetchNWSAlerts() {
      try {
        const resp = await fetch("https://api.weather.gov/alerts/active.atom");
        const str = await resp.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(str, "application/xml");
        const entries = Array.from(xml.getElementsByTagName("entry"));
        return entries.map(entry => {
          const eventEl = entry.querySelector("cap\\:event") || entry.querySelector("event");
          const areaEl  = entry.querySelector("cap\\:areaDesc") || entry.querySelector("areaDesc");
          const descEl  = entry.querySelector("summary") || entry.querySelector("description");
          const idEl    = entry.querySelector("cap\\:identifier") || entry.querySelector("id");
          return {
            id: idEl ? (idEl.textContent || "").trim() : undefined, // <--- extract identifier
            event: eventEl ? eventEl.textContent.trim() : "",
            areaDesc: areaEl ? areaEl.textContent.trim() : "",
            expires: entry.querySelector("cap\\:expires")?.textContent || "",
            description: descEl ? descEl.textContent : "",
            threats: extractThreatsFromAtom(entry)
          };
        });
      } catch (e) {
        return [];
      }
    }

    // Main pollAlerts logic: try TropiTracker, fallback to NWS
    async function pollAlerts() {
      if (isOverlayActive) {
        setTimeout(pollAlerts, 0);
        return;
      }

      let alerts = await fetchTropiTrackerAlerts();
      if (!alerts.length) {
        alerts = await fetchNWSAlerts();
      }
      if (!alerts.length) {
        setTimeout(pollAlerts, 1000);
        return;
      }

      const currentFeedKeys    = new Set();
      const processedThisCycle = new Set();

      alerts.forEach(alert => {
        const eventTextRaw = alert.event || "";
        const areaDesc     = alert.areaDesc || "";
        const expireDate   = alert.expires || "";
        const threats      = alert.threats;

        const groups = [formatAreaDesc(areaDesc)];

        // SEVERE THUNDERSTORM WARNING
        if (eventTextRaw.toLowerCase().includes("severe thunderstorm warning")) {
          const baseEventText = "Severe Thunderstorm Warning";
          let currentThreat = "DEFAULT";
          if (threats.thunderstormDamageThreatDestructive) currentThreat = "DESTRUCTIVE";
          else if (threats.thunderstormDamageThreatConsiderable) currentThreat = "CONSIDERABLE";

          groups.forEach(group => {
            const key = generateAlertKey(baseEventText, group, alert.id); // <--- pass id
            if (processedThisCycle.has(key)) return;
            processedThisCycle.add(key);
            currentFeedKeys.add(key);

            const record = issuedSevereAlerts[key];
            if (initialLoad) {
              issuedSevereAlerts[key] = {
                state: currentThreat,
                queued: false,
                lastDisplayed: currentThreat
              };
            } else if (!record) {
              const text = currentThreat==="DESTRUCTIVE"
                           ? "PDS Severe Thunderstorm Warning - Destructive"
                           : currentThreat==="CONSIDERABLE"
                             ? "Severe Thunderstorm Warning – Considerable"
                             : "Severe Thunderstorm Warning";
              const img  = currentThreat==="DESTRUCTIVE"
                           ? "PDS SVR.gif"
                           : currentThreat==="CONSIDERABLE"
                             ? "SVR - Considerable.gif"
                             : "SVR.gif";
              const aud  = currentThreat==="DESTRUCTIVE" ? "PDS SVR.mp3" : "SVR.mp3";

              enqueueAlert({
                alertKey: key,
                imageSrc: img,
                audioSrc: aud,
                eventText: text,
                areaDesc: group,
                type: "severe",
                state: currentThreat,
                destructive: currentThreat==="DESTRUCTIVE",
                considerable: currentThreat==="CONSIDERABLE"
              });
              issuedSevereAlerts[key] = {
                state: currentThreat,
                queued: true,
                lastDisplayed: currentThreat
              };
            } else if (record.lastDisplayed !== currentThreat) {
              const text = currentThreat==="DESTRUCTIVE"
                           ? "PDS Severe Thunderstorm Warning - Destructive Upgraded"
                           : currentThreat==="CONSIDERABLE"
                             ? "Severe Thunderstorm Warning – Considerable Upgraded"
                             : "Severe Thunderstorm Warning";
              const img  = currentThreat==="DESTRUCTIVE"
                           ? "PDS SVR.gif"
                           : currentThreat==="CONSIDERABLE"
                             ? "SVR - Considerable.gif"
                             : "SVR.gif";
              const aud  = currentThreat==="DESTRUCTIVE" ? "PDS SVR.mp3" : "SVR.mp3";

              enqueueAlert({
                alertKey: key,
                imageSrc: img,
                audioSrc: aud,
                eventText: text,
                areaDesc: group,
                type: "severe",
                state: currentThreat,
                destructive: currentThreat==="DESTRUCTIVE",
                considerable: currentThreat==="CONSIDERABLE",
                force: true
              });
              record.lastDisplayed = currentThreat;
            }
          });
        }

        // TORNADO WARNING
        else if (eventTextRaw.toLowerCase().includes("tornado warning")) {
          const baseEventText = "Tornado Warning";
          let currentState = "DEFAULT";
          if (threats.tornadoDetection === "OBSERVED" && threats.tornadoDamageThreatCatastrophic) {
            currentState = "EMERGENCY";
          } else if (
            (threats.tornadoDetection === "OBSERVED" || threats.tornadoDetection === "RADAR INDICATED") &&
            threats.tornadoDamageThreatConsiderable
          ) {
            currentState = "PDS";
          } else if (threats.tornadoDetection === "OBSERVED") {
            currentState = "OBSERVED";
          }

          groups.forEach(group => {
            const key = generateAlertKey(baseEventText, group, alert.id); // <--- pass id
            if (processedThisCycle.has(key)) return;
            processedThisCycle.add(key);
            currentFeedKeys.add(key);

            const record = issuedTornadoAlerts[key];
            if (initialLoad) {
              issuedTornadoAlerts[key] = {
                state: currentState,
                queued: false,
                lastDisplayed: currentState
              };
            } else if (!record) {
              let text, img, aud, pds=false, em=false;
              if (currentState==="EMERGENCY") {
                em = true; text = "Tornado Emergency"; img = "TORE.gif"; aud = "TORE.mp3";

              enqueueAlert({
                alertKey: key,
                imageSrc: img,
                audioSrc: aud,
                eventText: text,
                areaDesc: group,
                type: "tornado",
                state: currentState,
                pds,
                emergency: em
              });
              issuedTornadoAlerts[key] = {
                state: currentState,
                queued: true,
                lastDisplayed: currentState
              };
            } else if (record.lastDisplayed !== currentState) {
              let text, img, aud, pds=false, em=false;
              if (currentState==="EMERGENCY") {
                em = true; text = "Tornado Emergency Upgraded"; img = "TORE.gif"; aud = "TORE Upgraded.mp3";
              } else if (currentState==="PDS") {
                pds = true; text = "PDS Tornado Warning Upgraded"; img = "PDS TOR.gif"; aud = "PDS TOR - TOR Upgraded.mp3";
              } else if (currentState==="OBSERVED") {
                text = "Observed Tornado Warning Upgraded"; img = "TOR.gif"; aud = "PDS TOR - TOR Upgraded.mp3";
              } else {
                text = "Tornado Warning"; img = "TOR.gif"; aud = "TOR.mp3";
              }

              enqueueAlert({
                alertKey: key,
                imageSrc: img,
                audioSrc: aud,
                eventText: text,
                areaDesc: group,
                type: "tornado",
                state: currentState,
                pds,
                emergency: em,
                force: true
              });
              record.lastDisplayed = currentState;
            }
          });
        }

        // FLASH FLOOD WARNING
        else if (eventTextRaw.toLowerCase().includes("flash flood warning")) {
          const baseEventText = "Flash Flood Warning";
          let currentFF = "DEFAULT";
          if (threats.flashFloodDamageThreat === "CATASTROPHIC") currentFF = "CATASTROPHIC";
          else if (threats.flashFloodDamageThreat === "CONSIDERABLE") currentFF = "CONSIDERABLE";

          groups.forEach(group => {
            const key = generateAlertKey(baseEventText, group, alert.id); // <--- pass id

              }

              enqueueAlert({
                alertKey: key,
                imageSrc: img,
                audioSrc: aud,
                eventText: text,
                areaDesc: group,
                type: "flashFlood",
                state: currentFF,
                flashFloodConsiderable: currentFF==="CONSIDERABLE",
                flashFloodCatastrophic: currentFF==="CATASTROPHIC"
              });
              issuedFlashFloodAlerts[key] = {
                state: currentFF,
                queued: true,
                lastDisplayed: currentFF
              };
            } else if (record.lastDisplayed !== currentFF) {
              let text, img, aud;
              if (currentFF==="CATASTROPHIC") {
                text = "Flash Flood Emergency Upgraded"; img = "FFWE.gif"; aud = "FFWE Upgraded.mp3";
              } else if (currentFF==="CONSIDERABLE") {
                text = "Flash Flood Warning - Considerable Upgraded"; img = "FFW - Considerable.gif"; aud = "FFW - Considerable Upgraded.mp3";
              }

              enqueueAlert({
                alertKey: key,
                imageSrc: img,
                audioSrc: aud,
                eventText: text,
                areaDesc: group,
                type: "flashFlood",
                state: currentFF,
                flashFloodConsiderable: currentFF==="CONSIDERABLE",
                flashFloodCatastrophic: currentFF==="CATASTROPHIC",
                force: true
              });
              record.lastDisplayed = currentFF;
            }
          });
        }
      });

      // cleanup vanished alerts
      [
        issuedSevereAlerts,
        issuedTornadoAlerts,
        issuedFlashFloodAlerts
      ].forEach(map => {
        for (let k in map) {
          if (!currentFeedKeys.has(k)) delete map[k];
        }
      });

      if (!initialLoad && !isOverlayActive && alertQueue.length) {
        processNextAlert();
      }
      if (initialLoad) {
        initialLoad = false;

      setTimeout(pollAlerts, 1000);

      tropical_storm: {

      hurricane: {

        mostProbablePeakWindGust: "55-70 MPH",

      mesoscale_precipitation_discussion: {

        areaDesc: "Northeast NC....Eastern VA...Southern & Eastern",
        concerning: "Heavy rainfall...Flash flooding possible",
        watchProbability: "",

        mostProbablePeakWindGust: "",
        type: "mesoscalePrecipitationDiscussion"
      }
    };

    const testButtonGroup = document.querySelector(".button-group");
    const existingCustomizationTypes = new Set(
      Object.values(alertConfigs)
        .map(config => getPopupCustomizationType(config))
        .filter(Boolean)
        .map(alertType => alertType.trim().toLowerCase())
    );
    Object.keys(window.POPUP_ALERT_CUSTOMIZATIONS || {}).forEach(alertType => {
      if (existingCustomizationTypes.has(alertType.trim().toLowerCase())) return;

      const configKey = `custom:${alertType}`;
      alertConfigs[configKey] = {
        eventText: alertType,
        areaDesc: "Sample County, State",
        type: "custom",
        customizationType: alertType
      };
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = alertType;
      button.addEventListener("click", () => showAlert(configKey));
      testButtonGroup.appendChild(button);
    });

    function setTestMode(mode, button) {
      testAsUpgraded = (mode === 'upgraded');
      document.querySelectorAll('.test-buttons button').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
    }

    function getUpgradedAudio(type, cfg) {
      if (type === 'tornado') {
        if (cfg.emergency) return 'TORE Upgraded.mp3';
        return 'PDS TOR - TOR Upgraded.mp3';
      }
      if (type === 'flashFlood') {
        if (cfg.flashFloodCatastrophic) return 'FFWE Upgraded.mp3';
        if (cfg.flashFloodConsiderable) return 'FFW - Considerable Upgraded.mp3';
        return cfg.audioSrc;
      }
      return cfg.audioSrc;
    }

    function getRandomTestAlertFields(cfg) {
      const sampleValues = {
        MaxHailSize: ["0.75 IN", "1.25 IN", "2.00 IN"],
        TornadoDamageThreat: ["CONSIDERABLE", "CATASTROPHIC"],
        Tornado: ["RADAR INDICATED", "OBSERVED"],
        FlashFlood: ["FLASH FLOOD", "FLASH FLOODING"],
        FlashFloodDamageThreat: ["CONSIDERABLE", "CATASTROPHIC"],
        ThunderstormDamageThreat: ["CONSIDERABLE", "DESTRUCTIVE"],
        MaxWindGust: ["60 MPH", "75 MPH", "90 MPH"],
        WindThreat: ["CONSIDERABLE", "DESTRUCTIVE"],
        HailThreat: ["CONSIDERABLE", "DESTRUCTIVE"],
        Hazard: ["TORNADO", "FLASH FLOOD", "DAMAGING WIND"],
        Source: ["RADAR INDICATED", "TRAINED SPOTTER", "LAW ENFORCEMENT"],
        Impact: ["DANGEROUS CONDITIONS", "SIGNIFICANT DAMAGE", "LIFE-THREATENING"]
      };
      const fields = Object.fromEntries(Object.entries(sampleValues).map(([field, values]) => [
        field,
        values[Math.floor(Math.random() * values.length)]
      ]));
      if (cfg.type === "tornado") {
        fields.MaxWindGust = "";
        fields.MaxHailSize = "2.00 IN";
        fields.TornadoDamageThreat = cfg.emergency ? "CATASTROPHIC" : cfg.pds ? "CONSIDERABLE" : "";
        if (cfg.emergency) {
          fields.Tornado = "Observed";
          fields.Hazard = "Deadly Tornado";
          fields.Source = "Law Enforcement confirmed tornado";
          fields.Impact = "You're in a life-threatening situation. Flying debris may be deadly to those caught without shelter. Mobile homes will be destroyed. Considerable damage to homes, businesses, and vehicles is likely and complete destruction is possible.";
        } else if (cfg.pds) {
          fields.Tornado = "Observed";
          fields.Hazard = "Damaging Tornado";
          fields.Source = "Law Enforcement confirmed tornado";
          fields.Impact = "You're in a life-threatening situation. Flying debris may be deadly to those caught without shelter. Mobile homes will be destroyed. Considerable damage to homes, businesses, and vehicles is likely and complete destruction is possible.";
        } else if (cfg.state === "OBSERVED") {
          fields.Tornado = "Observed";
          fields.Hazard = "Damaging Tornado";
          fields.Source = "Law Enforcement confirmed tornado";
          fields.Impact = "Flying Debris will be dangerous to those caught without shelter.";
        } else {
          fields.Tornado = "Radar Indicated";
          fields.Hazard = "Tornado";
          fields.Source = "Radar Indicated";
          fields.Impact = "Flying Debris will be dangerous to those caught without shelter.";
        }
      } else if (cfg.type === "flashFlood") {
        fields.FlashFloodDamageThreat = cfg.flashFloodCatastrophic ? "CATASTROPHIC" : cfg.flashFloodConsiderable ? "CONSIDERABLE" : "";
        fields.Hazard = cfg.flashFloodCatastrophic || cfg.flashFloodConsiderable ?
          "Life-threatening flash flooding" : "Flash flooding caused by thunderstorms";
        fields.Source = "Radar";
        fields.Impact = cfg.flashFloodCatastrophic ?
          "This is a PARTICULARLY DANGEROUS SITUATION. SEEK HIGHER GROUND NOW! Life-threatening flash flooding of low water crossings, small creeks and streams, urban areas, highways, streets and underpasses." :
          cfg.flashFloodConsiderable ?
            "Life-threatening flash flooding of creeks and streams, urban areas, highways, streets and underpasses." :
            "Flash flooding of small creeks and streams, urban areas, highways, streets and underpasses as well as other poor drainage and low-lying areas.";
      } else if (cfg.type === "severe") {
        fields.ThunderstormDamageThreat = cfg.destructive ? "DESTRUCTIVE" : cfg.considerable ? "CONSIDERABLE" : "";
        fields.Source = "Radar Indicated";
        fields.Hazard = "";
        if (cfg.destructive) {
          fields.MaxWindGust = "90 MPH";
          fields.MaxHailSize = "2.75 IN";
          fields.Impact = "You are in a life-threatening situation. Flying debris may be deadly to those caught without shelter. Mobile homes will be heavily damaged or destroyed. Homes and businesses will have substantial roof and window damage. Expect extensive tree damage and power outages.";
        } else if (cfg.considerable) {
          fields.MaxWindGust = "70 MPH";
          fields.MaxHailSize = "1.75 IN";
          fields.Impact = "Minor damage to vehicles is possible. Expect considerable tree damage. Wind damage is also likely to mobile homes, roofs, and outbuildings.";
        } else {
          fields.MaxWindGust = "60 MPH";
          fields.MaxHailSize = "1.25 IN";
          fields.Impact = "Expect damage to trees and powerlines.";
        }
      } else if (cfg.type === "dustStorm") {
        fields.Hazard = "Less than a quarter mile visibility with strong wind in excess of 50 mph.";
        fields.Source = "Doppler radar.";
        fields.Impact = "Dangerous life-threatening travel.";
      } else if (cfg.type === "snowSquall") {
        fields.Hazard = "Flash freeze on roads and whiteout conditions with near zero visibility due to intense bursts of heavy snow and gusty winds. Wind gusts greater than 35 mph.";
        fields.Source = "Public reported.";
        fields.Impact = "Dangerous and life-threatening travel conditions are expected to develop rapidly in the warning area.";
      } else if (cfg.customizationType === "Special Marine Warning") {
        fields.Hazard = "Waterspouts, wind gusts to 40 knots, and small hail.";
        fields.Source = "Radar.";
        fields.Impact = "Waterspouts can easily overturn boats and create locally hazardous seas. Small craft could be damaged in briefly higher winds and suddenly higher waves.";
      }
      return fields;
    }

    function showAlert(type) {
      const cfg = alertConfigs[type];
      if (!cfg) return;

      let eventText = cfg.eventText;
      let audioSrc = cfg.audioSrc;
      if (testAsUpgraded) {
        eventText += " Upgraded";
        audioSrc = getUpgradedAudio(cfg.type, cfg);
      }

      alertQueue.push({ ...cfg, eventText, audioSrc, alertFields: getRandomTestAlertFields(cfg) });
      if (!isOverlayActive) processNextAlert();
    }
  </script>
